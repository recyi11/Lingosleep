name: Fix playlist pagination

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-playlist-pagination.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch playlist state reset
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/main.tsx')
          text = path.read_text()
          anchor = '''  useEffect(() => {\n    if (availableTopics.length && !availableTopics.includes(config.topic)) {\n      updateConfig("topic", availableTopics[0]);\n    }\n  }, [availableTopics, config.topic]);\n'''
          patch = anchor + '''\n  useEffect(() => {\n    setPlaylistSeed(0);\n    setPlaylistPage(0);\n  }, [config.targetLanguage, config.level, config.topic]);\n'''
          if 'setPlaylistPage(0);\n  }, [config.targetLanguage, config.level, config.topic]);' not in text:
              if anchor not in text:
                  raise SystemExit('Expected playlist anchor not found')
              text = text.replace(anchor, patch, 1)
              path.write_text(text)
          PY
      - name: Verify build
        run: |
          npm ci
          npm run build
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Fix playlist state reset"
            git push origin HEAD:main
          fi
