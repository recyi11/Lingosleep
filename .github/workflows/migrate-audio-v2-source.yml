name: Migrate playback to content-addressed audio v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-audio-v2-source.yml'
      - 'scripts/apply-audio-v2-source.mjs'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch playback source
        run: node scripts/apply-audio-v2-source.mjs

      - name: Build
        run: npm run build

      - name: Commit source migration and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/migrate-audio-v2-source.yml scripts/apply-audio-v2-source.mjs
          git add src/main.tsx vite.config.ts
          git commit -m "Use content-addressed vocabulary audio"
          git pull --rebase origin main
          git push origin HEAD:main
