name: Refine exam vocabulary quality
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-exam-expansion-20260915.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refine generator filters and JMdict validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/build-exam-vocab-expansion.py')
          s = p.read_text()
          if 'import tarfile\n' not in s:
              s = s.replace('import re\n', 'import re\nimport tarfile\n', 1)

          start = s.index('def choose_japanese(')
          end = s.index('\ndef local(', start)
          new_block = r'''def _jmdict_pos_allowed(tags: list[str]) -> bool:
    for tag in tags:
        if tag == "n" or tag in {"n-adv", "n-t", "adv", "adv-to", "conj"}:
            return True
        if tag.startswith("v1") or tag.startswith("v5") or tag in {"vs", "vs-i", "vs-s", "vk", "vz"}:
            return True
        if tag.startswith("adj-"):
            return True
    return False


def _load_jmdict_for(targets: set[str]) -> dict[str, list[dict]]:
    release = json.loads(fetch_text('https://api.github.com/repos/scriptin/jmdict-simplified/releases/latest'))
    assets = release.get('assets', [])
    candidates = [
        a for a in assets
        if a.get('name', '').startswith('jmdict-eng-')
        and a.get('name', '').endswith('.json.tgz')
        and 'common' not in a.get('name', '')
        and 'examples' not in a.get('name', '')
    ]
    if not candidates:
        raise RuntimeError('No JMdict English release asset found')
    asset = candidates[0]
    archive = ROOT / '.tmp-jmdict-eng.tgz'
    print('downloading JMdict', asset['name'])
    download(asset['browser_download_url'], archive)
    with tarfile.open(archive, 'r:gz') as tf:
        members = [m for m in tf.getmembers() if m.isfile() and m.name.endswith('.json')]
        if not members:
            raise RuntimeError('JMdict archive has no JSON member')
        fh = tf.extractfile(members[0])
        if fh is None:
            raise RuntimeError('Could not read JMdict JSON member')
        data = json.load(fh)
    archive.unlink(missing_ok=True)
    index: dict[str, list[dict]] = {w: [] for w in targets}
    for entry in data.get('words', []):
        spellings = {x.get('text', '') for x in entry.get('kanji', [])}
        spellings.update(x.get('text', '') for x in entry.get('kana', []))
        for text in spellings & targets:
            index[text].append(entry)
    print('JMdict matched targets', sum(1 for v in index.values() if v), '/', len(index))
    return index


def _jmdict_lexical_info(word: str, reading: str, entries: list[dict]) -> dict | None:
    blocked_misc = {'arch', 'obs', 'rare', 'dated'}
    best: list[tuple[int, dict]] = []
    for entry in entries:
        kanji = entry.get('kanji', [])
        kana = entry.get('kana', [])
        kanji_match = [x for x in kanji if x.get('text') == word]
        kana_word_match = [x for x in kana if x.get('text') == word]
        reading_match = []
        for x in kana:
            if x.get('text') != reading:
                continue
            applies = x.get('appliesToKanji', [])
            if kanji_match and '*' not in applies and word not in applies:
                continue
            reading_match.append(x)
        if not reading_match and not (kana_word_match and word == reading):
            continue
        common = any(x.get('common') for x in kanji_match + reading_match + kana_word_match)
        for sense in entry.get('sense', []):
            if not _jmdict_pos_allowed(sense.get('partOfSpeech', [])):
                continue
            if blocked_misc.intersection(sense.get('misc', [])):
                continue
            applies_k = sense.get('appliesToKanji', [])
            applies_r = sense.get('appliesToKana', [])
            if kanji_match and '*' not in applies_k and word not in applies_k:
                continue
            if '*' not in applies_r and reading not in applies_r and word not in applies_r:
                continue
            glosses = []
            for g in sense.get('gloss', []):
                if g.get('lang') != 'eng' or not g.get('text'):
                    continue
                text = g['text'].strip()
                if text and text not in glosses:
                    glosses.append(text)
                if len(glosses) >= 3:
                    break
            gloss = concise_gloss('; '.join(glosses))
            if not gloss:
                continue
            score = (1 if common else 0)
            best.append((score, {'gloss': gloss, 'common': common}))
    if not best:
        return None
    best.sort(key=lambda x: -x[0])
    return best[0][1]


def choose_japanese(jlpt_map: dict[str, str], existing: set[str]) -> list[dict]:
    raw_by_level: dict[str, list[dict]] = {}
    targets: set[str] = set()
    for target_level in JA_TARGETS:
        rows = csv.DictReader(io.StringIO(fetch_text(WALLER_URLS[target_level])))
        pool_seen: set[str] = set()
        raw: list[dict] = []
        for row in rows:
            kana = (row.get('kana') or '').strip()
            kanji = (row.get('kanji') or '').strip()
            word = kanji or kana
            if not valid_headword(word) or len(word) < 2 or word in existing or word in pool_seen:
                continue
            if jlpt_map.get(word) != target_level:
                continue
            if any(x in word for x in JP_BAD_WORD_PARTS) or word.endswith(JP_PHRASE_ENDINGS):
                continue
            freq = zipf_frequency(word, 'ja')
            min_freq = {'N3': 2.8, 'N2': 2.4, 'N1': 1.9}[target_level]
            max_freq = {'N3': 5.15, 'N2': 4.9, 'N1': 4.6}[target_level]
            if not (min_freq <= freq <= max_freq):
                continue
            reading = kana or word
            raw.append({'word': word, 'reading': reading, 'exam': target_level, 'freq': freq})
            pool_seen.add(word)
            targets.add(word)
        raw_by_level[target_level] = raw

    jmdict = _load_jmdict_for(targets)
    selected: list[dict] = []
    used = set(existing)
    for target_level, wanted in JA_TARGETS.items():
        pool: list[dict] = []
        for item in raw_by_level[target_level]:
            if item['word'] in used:
                continue
            info = _jmdict_lexical_info(item['word'], item['reading'], jmdict.get(item['word'], []))
            if not info:
                continue
            item = {**item, **info}
            pool.append(item)
        # Prefer entries JMdict itself marks common, then higher frequency within a
        # level-appropriate band. This avoids ultra-basic high-frequency items.
        pool.sort(key=lambda x: (-int(x['common']), -x['freq'], len(x['word']), x['word']))
        if len(pool) < wanted:
            raise RuntimeError(f'not enough validated Japanese {target_level}: {len(pool)} < {wanted}')
        take = pool[:wanted]
        selected.extend(take)
        used.update(x['word'] for x in take)
        print(target_level, 'JMdict-validated candidates', len(pool), 'selected', len(take))
    return selected
'''
          s = s[:start] + new_block + s[end:]

          old_cond = """            if not valid_headword(word) or word in existing or word in seen_source or grade_map.get(word) != grade:\n                elem.clear(); root.clear(); continue\n"""
          new_cond = """            if not valid_headword(word) or len(word) < 2 or word in existing or word in seen_source or grade_map.get(word) != grade:\n                elem.clear(); root.clear(); continue\n"""
