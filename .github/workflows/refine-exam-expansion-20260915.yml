          old_append = """            pronunciation = (first_desc_feat(elem, 'pronunciation') or word).strip()\n            pools[grade].append({\n                'word': word,\n                'reading': pronunciation,\n                'definition_ko': definition_ko,\n                'gloss': concise_gloss('; '.join(eng)),\n                'zh': '；'.join(zh[:2]),\n                'grade': grade,\n                'freq': zipf_frequency(word, 'ko'),\n            })\n"""
          new_append = """            pronunciation = (first_desc_feat(elem, 'pronunciation') or word).strip().replace('ː', '')\n            freq = zipf_frequency(word, 'ko')\n            min_freq = {'중급': 2.8, '고급': 2.0}[grade]\n            max_freq = {'중급': 5.8, '고급': 5.3}[grade]\n            if not (min_freq <= freq <= max_freq):\n                elem.clear(); root.clear(); continue\n            pools[grade].append({\n                'word': word,\n                'reading': pronunciation,\n                'definition_ko': definition_ko,\n                'gloss': concise_gloss('; '.join(eng)),\n                'zh': '；'.join(zh[:2]),\n                'grade': grade,\n                'freq': freq,\n            })\n"""
          if old_append not in s:
              raise SystemExit('Korean append anchor not found')
          s = s.replace(old_append, new_append, 1)
          p.write_text(s)
          PY
      - name: Install vocabulary tooling
        run: python -m pip install --disable-pip-version-check -q wordfreq pykakasi hangul-romanize mecab-python3 ipadic mecab-ko-dic
      - name: Regenerate refined 1500-word expansion
        run: python scripts/build-exam-vocab-expansion.py
      - name: Quality audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          src = Path('src')
          ja = (src/'vocabulary-exam-expansion-ja.ts').read_text()
          ko = (src/'vocabulary-exam-expansion-ko.ts').read_text()
          assert ja.count('targetLanguage: "Japanese"') == 800
          assert ja.count('examLevel: "N3"') == 200
          assert ja.count('examLevel: "N2"') == 350
          assert ja.count('examLevel: "N1"') == 250
          assert ko.count('targetLanguage: "Korean"') == 700
          assert ko.count('koreanGrade: "중급"') == 250
          assert ko.count('koreanGrade: "고급"') == 450
          jw = re.findall(r'targetText: "([^"]+)"', ja)
          kw = re.findall(r'targetText: "([^"]+)"', ko)
          assert len(jw) == len(set(jw)) == 800
          assert len(kw) == len(set(kw)) == 700
          assert all(len(w) >= 2 and not re.search(r'\s', w) for w in jw + kw)
          banned_ja = {'日本','何か','あっ','時','者','事','分','円','性','どうか'}
          banned_ko = {'하','은','게','과','면','적','요','자','여'}
          assert not (banned_ja & set(jw)), banned_ja & set(jw)
          assert not (banned_ko & set(kw)), banned_ko & set(kw)
          assert 'copper coin' not in ja.lower()
          assert 'English: ""' not in ja and 'English: ""' not in ko
          assert '"Simplified Chinese": ""' not in ja and '"Simplified Chinese": ""' not in ko
          print('REFINED_AUDIT_OK')
          print('JA first 25:', jw[:25])
          print('KO first 25:', kw[:25])
          PY
      - name: Build app
        run: |
          npm ci
          npm run build
      - name: Commit refined vocabulary if main stayed unchanged
        shell: bash
        run: |
          rm -rf .tmp-krdict .tmp-jmdict-eng.tgz
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$BASE_SHA" ]; then
            echo "main changed while refining vocabulary; refusing stale commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-exam-vocab-expansion.py src/vocabulary-exam-expansion-ja.ts src/vocabulary-exam-expansion-ko.ts
          git commit -m "Refine exam vocabulary with dictionary validation"
          git push origin HEAD:main
