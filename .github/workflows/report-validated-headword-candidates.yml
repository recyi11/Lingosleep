name: Generate validated headword expansion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/report-validated-headword-candidates.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: git pull --ff-only origin main
      - name: Install validation tools
        run: pip install -q sudachipy sudachidict_core pykakasi
      - name: Generate 500 validated standalone headwords
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, io, json, re, urllib.request
          from sudachipy import dictionary
          from pykakasi import kakasi

          JLPT='https://raw.githubusercontent.com/Bluskyo/JLPT_Vocabulary/main/data/vocab/results/JLPT_vocab_ALL.csv'
          YONSEI=[f'https://raw.githubusercontent.com/Amulopapa67/open-yonsei-korean-vocabulary/main/data/csv/vol-0{i}.csv' for i in range(2,7)]

          def get(url):
              with urllib.request.urlopen(url, timeout=60) as r:
                  return r.read().decode('utf-8-sig')

          tokenizer=dictionary.Dictionary().create()
          kks=kakasi()
          def kata_to_hira(s):
              return ''.join(chr(ord(c)-0x60) if 'ァ' <= c <= 'ヶ' else c for c in s)
          def reading_for(word):
              r=''.join(t.reading_form() for t in tokenizer.tokenize(word))
              return kata_to_hira(r)
          def romanize(hira):
              return ''.join(x['hepburn'] for x in kks.convert(hira))
          def clean_zh(s):
              return re.sub(r'\s+', '，', s.strip()).replace('，，','，')
          def clean_en(s):
              return re.sub(r'\s+', ' ', s.strip())

          existing={'Japanese':set(),'Korean':set()}
          for p in Path('src').glob('vocabulary*.ts'):
              if p.name == 'vocabulary-validated-expansion.ts': continue
              text=p.read_text()
              for lang,target in re.findall(r'targetLanguage:\s*"(Japanese|Korean)"[^\n]*?targetText:\s*"([^"]+)"', text):
                  existing[lang].add(target.strip())
          noun=Path('src/vocabulary-noun-expansion.ts')
          if noun.exists():
              text=noun.read_text()
              for m in re.finditer(r'^\s*\["[^"]+",\s*"[^"]+",\s*"[^"]+",\s*"([^"]+)",\s*"[^"]+",\s*"[^"]+",\s*"([^"]+)"\],?$', text, re.M):
                  ja,ko=m.groups(); existing['Japanese'].add(ja); existing['Korean'].add(ko)

          jlpt={}
          for row in csv.DictReader(io.StringIO(get(JLPT))):
              k=row['Kanji'].strip(); lv=row['Level'].strip()
              if lv not in {'1','2','3'} or not re.fullmatch(r'[一-龯々ヶ]+',k): continue
              jlpt.setdefault(k,[]).append(int(lv))

          auto=[]; seen_auto_ja=set(); seen_auto_ko=set()
          for url in YONSEI:
              for r in csv.DictReader(io.StringIO(get(url))):
                  ko=r['korean'].strip(); ja=r['origin_detail'].strip()
                  if r['entry_kind']!='lexeme' or r['pos']!='명사' or r['review_status']!='high' or r['origin_type']!='hanja': continue
                  try: conf=float(r['match_confidence'] or 0)
                  except: conf=0
                  if conf < .90: continue
                  if not re.fullmatch(r'[一-龯々ヶ]{2,6}',ja) or not re.fullmatch(r'[가-힣]{2,8}',ko): continue
                  if ja not in jlpt or ja in existing['Japanese'] or ko in existing['Korean']: continue
                  jlevel=min(jlpt[ja]); level='Advanced' if jlevel in (1,2) else 'Intermediate'
                  volume=int(r['volume'])
                  if level=='Advanced' and volume < 3: continue
                  rd=reading_for(ja); rom=romanize(rd)
                  if not rd or re.search(r'[一-龯]',rd) or not rom: continue
                  if ja in seen_auto_ja or ko in seen_auto_ko: continue
                  seen_auto_ja.add(ja); seen_auto_ko.add(ko)
                  auto.append(dict(level=level,jlpt=jlevel,volume=volume,order=int(r['source_order']),ja=ja,ko=ko,zh=clean_zh(r['chinese']),en=clean_en(r['english']),reading=rd,roman=rom,source='cross-validated'))

          # Remove entries whose cross-language senses are not sufficiently aligned, plus one unsuitable night-review term.
          blacklist={'自殺','境遇','課外','直後','就業','年間'}
          auto=[x for x in auto if x['ja'] not in blacklist]

          MANUAL_INTER='''
          医療|의료|医疗|healthcare
          経済|경제|经济|economy
          社会|사회|社会|society
          政治|정치|政治|politics
