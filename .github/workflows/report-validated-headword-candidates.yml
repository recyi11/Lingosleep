          def parse_manual(text,level):
              out=[]
              for line in text.splitlines():
                  line=line.strip()
                  if not line: continue
                  ja,ko,zh,en=[x.strip() for x in line.split('|',3)]
                  rd=reading_for(ja); rom=romanize(rd)
                  out.append(dict(level=level,ja=ja,ko=ko,zh=zh,en=en,reading=rd,roman=rom,source='manual-reviewed'))
              return out

          manual_inter=parse_manual(MANUAL_INTER,'Intermediate')
          manual_adv=parse_manual(MANUAL_ADV,'Advanced')

          selected={'Intermediate':[],'Advanced':[]}
          used_ja=set(existing['Japanese']); used_ko=set(existing['Korean'])
          def accept(x):
              ja=x['ja']; ko=x['ko']
              if ja in used_ja or ko in used_ko: return False
              if re.search(r'[\s,，、;/]',ja) or re.search(r'[\s,，、;/]',ko): return False
              if not re.fullmatch(r'[가-힣]{2,8}',ko): return False
              if not x['reading'] or not x['roman']: return False
              used_ja.add(ja); used_ko.add(ko); selected[x['level']].append(x); return True

          auto_inter=sorted((x for x in auto if x['level']=='Intermediate'),key=lambda x:(x['volume'],x['order']))
          auto_adv=sorted((x for x in auto if x['level']=='Advanced'),key=lambda x:(x['jlpt'],x['volume'],x['order']))
          for x in auto_inter: 
              if len(selected['Intermediate'])>=100: break
              accept(x)
          for x in manual_inter:
              if len(selected['Intermediate'])>=100: break
              accept(x)
          for x in auto_adv:
              if len(selected['Advanced'])>=150: break
              accept(x)
          for x in manual_adv:
              if len(selected['Advanced'])>=150: break
              accept(x)

          if len(selected['Intermediate'])!=100 or len(selected['Advanced'])!=150:
              raise SystemExit(f"Insufficient validated entries: Intermediate={len(selected['Intermediate'])}, Advanced={len(selected['Advanced'])}")

          def js(s): return json.dumps(s,ensure_ascii=False)
          lines=['import type { VocabItem } from "./vocabulary";','','// 500 standalone headwords: 200 Intermediate + 300 Advanced.','// Cross-validated entries come from JLPT headwords matched to high-confidence Yonsei Korean noun lexemes;','// remaining entries are manually reviewed standalone lexemes.','export const validatedHeadwordExpansion: VocabItem[] = [']
          counters={'Intermediate':0,'Advanced':0}
          patterns=[
            ('{w}の意味を確認します。','We review the meaning of {e}.','我们复习“{z}”的含义。','{w}의 뜻을 확인해요.','We review the meaning of {e}.','我们复习“{z}”的含义。'),
            ('{w}という語を覚えます。','I learn the word {e}.','我学习“{z}”这个词。','{w}라는 단어를 외워요.','I learn the word {e}.','我学习“{z}”这个词。'),
            ('{w}の使い方を学びます。','I learn how to use {e}.','我学习“{z}”的用法。','{w}의 쓰임을 배워요.','I learn how to use {e}.','我学习“{z}”的用法。'),
            ('{w}を文脈で確認します。','I review {e} in context.','我在语境中复习“{z}”。','{w}를 문맥에서 확인해요.','I review {e} in context.','我在语境中复习“{z}”。'),
          ]
          for level in ('Intermediate','Advanced'):
              for x in selected[level]:
                  counters[level]+=1; n=counters[level]; p=patterns[(n-1)%len(patterns)]
                  for lang in ('ja','ko'):
                      if lang=='ja':
                          target=x['ja']; reading=x['reading']; roman=x['roman']; topic='JLPT'; ex=p[0].format(w=target); exen=p[1].format(e=x['en']); exzh=p[2].format(z=x['zh']); tl='Japanese'
                      else:
                          target=x['ko']; reading=x['ko']; roman=''; topic='TOPIK'; ex=p[3].format(w=target); exen=p[4].format(e=x['en']); exzh=p[5].format(z=x['zh']); tl='Korean'
                      ident=f"{lang}-validated-{level.lower()}-{n:03d}"
                      lines += ['  {',f'    id: {js(ident)},',f'    targetLanguage: {js(tl)},',f'    targetText: {js(target)},',f'    meanings: {{ English: {js(x["en"])}, "Simplified Chinese": {js(x["zh"])} }},',f'    reading: {js(reading)},',f'    romanization: {js(roman)},',f'    level: {js(level)},',f'    topic: {js(topic)},',f'    exampleSentence: {js(ex)},',f'    exampleTranslations: {{ English: {js(exen)}, "Simplified Chinese": {js(exzh)} }},','  },']
          lines += ['];','']
          Path('src/vocabulary-validated-expansion.ts').write_text('\n'.join(lines))

          vp=Path('src/vocabulary.ts'); vt=vp.read_text()
          imp='import { validatedHeadwordExpansion } from "./vocabulary-validated-expansion";'
          if imp not in vt:
              marker='import { advancedNounExpansion, intermediateNounExpansion } from "./vocabulary-noun-expansion";'
              vt=vt.replace(marker,marker+'\n'+imp)
          if '  ...validatedHeadwordExpansion,' not in vt:
              vt=vt.replace('  ...advancedNounExpansion,\n];','  ...advancedNounExpansion,\n  ...validatedHeadwordExpansion,\n];')
          vp.write_text(vt)
          print('AUTO_INTER_USED',sum(1 for x in selected['Intermediate'] if x['source']=='cross-validated'))
          print('MANUAL_INTER_USED',sum(1 for x in selected['Intermediate'] if x['source']=='manual-reviewed'))
          print('AUTO_ADV_USED',sum(1 for x in selected['Advanced'] if x['source']=='cross-validated'))
          print('MANUAL_ADV_USED',sum(1 for x in selected['Advanced'] if x['source']=='manual-reviewed'))
          print('TOTAL_WORDS',2*(len(selected['Intermediate'])+len(selected['Advanced'])))
          PY
      - name: Audit generated vocabulary
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/vocabulary-validated-expansion.ts'); t=p.read_text()
          entries=re.findall(r'id:\s*"([^"]+)"[\s\S]*?targetLanguage:\s*"(Japanese|Korean)"[\s\S]*?targetText:\s*"([^"]+)"[\s\S]*?level:\s*"(Intermediate|Advanced)"',t)
          if len(entries)!=500: raise SystemExit(f'Expected 500 entries, got {len(entries)}')
          levels={}; seen=set()
          for ident,lang,target,level in entries:
              levels[level]=levels.get(level,0)+1
              key=(lang,target)
              if key in seen: raise SystemExit(f'Duplicate generated target: {key}')
              seen.add(key)
              if re.search(r'[\s,，、;/]',target): raise SystemExit(f'Phrase-like generated target: {key}')
          if levels!={'Intermediate':200,'Advanced':300}: raise SystemExit(f'Bad level distribution: {levels}')
          if '相关' in t or re.search(r'\brelated\s+[^,.]+',t,re.I): raise SystemExit('Placeholder meaning detected')
          # Ensure no generated target duplicates pre-existing vocabulary.
          old={'Japanese':set(),'Korean':set()}
          for q in Path('src').glob('vocabulary*.ts'):
              if q==p: continue
              s=q.read_text()
              for lang,target in re.findall(r'targetLanguage:\s*"(Japanese|Korean)"[^\n]*?targetText:\s*"([^"]+)"',s): old[lang].add(target)
          noun=Path('src/vocabulary-noun-expansion.ts')
          if noun.exists():
              s=noun.read_text()
              for m in re.finditer(r'^\s*\["[^"]+",\s*"[^"]+",\s*"[^"]+",\s*"([^"]+)",\s*"[^"]+",\s*"[^"]+",\s*"([^"]+)"\],?$',s,re.M):
                  ja,ko=m.groups(); old['Japanese'].add(ja); old['Korean'].add(ko)
          overlap=[(lang,target) for _,lang,target,_ in entries if target in old[lang]]
          if overlap: raise SystemExit(f'Generated overlap with existing: {overlap[:20]}')
          print('AUDIT_OK',levels,'unique',len(seen))
          PY
      - name: Verify build
        run: |
          npm ci
          npm run build
      - name: Commit expansion safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vocabulary.ts src/vocabulary-validated-expansion.ts
          git commit -m "Add 500 validated Intermediate and Advanced headwords"
          git pull --rebase origin main
          npm run build
          git push origin HEAD:main
