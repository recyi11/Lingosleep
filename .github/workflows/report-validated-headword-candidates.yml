          通信|통신|通信|communication
          広告|광고|广告|advertising
          出版|출판|出版|publishing
          感情|감정|感情|emotion
          '''

          MANUAL_ADV='''
          概念|개념|概念|concept
          観点|관점|观点|viewpoint
          論点|논점|论点|point at issue
          根拠|근거|依据|grounds
          推論|추론|推论|inference
          論理|논리|逻辑|logic
          因果|인과|因果|causality
          均衡|균형|均衡|equilibrium
          体系|체계|体系|system
          基盤|기반|基础|foundation
          尺度|척도|尺度|scale
          領域|영역|领域|domain
          分野|분야|领域|field
          要因|요인|要因|factor
          要素|요소|要素|element
          文脈|맥락|语境|context
          実態|실태|实际状态|actual state
          規範|규범|规范|norm
          倫理|윤리|伦理|ethics
          裁量|재량|裁量|discretion
          改革|개혁|改革|reform
          革新|혁신|革新|innovation
          変革|변혁|变革|transformation
          転換|전환|转换|shift
          導入|도입|导入|introduction
          抑制|억제|抑制|restraint
          緩和|완화|缓和|easing
          強化|강화|强化|strengthening
          拡大|확대|扩大|expansion
          縮小|축소|缩小|reduction
          中断|중단|中断|interruption
          再開|재개|重新开始|resumption
          廃止|폐지|废止|abolition
          撤廃|철폐|撤销|repeal
          制定|제정|制定|enactment
          改正|개정|修订|amendment
          施行|시행|施行|enforcement
          適用|적용|适用|application
          遵守|준수|遵守|compliance
          違反|위반|违反|violation
