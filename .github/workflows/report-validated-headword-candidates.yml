name: Report validated headword candidates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/report-validated-headword-candidates.yml'

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Japanese reading tools
        run: pip install -q sudachipy sudachidict_core pykakasi
      - name: Build cross-validated candidate report
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, io, json, re, urllib.request
          from sudachipy import dictionary
          from pykakasi import kakasi

          JLPT='https://raw.githubusercontent.com/Bluskyo/JLPT_Vocabulary/main/data/vocab/results/JLPT_vocab_ALL.csv'
          YONSEI=[f'https://raw.githubusercontent.com/Amulopapa67/open-yonsei-korean-vocabulary/main/data/csv/vol-0{i}.csv' for i in range(2,7)]

          def get(url):
              with urllib.request.urlopen(url, timeout=60) as r:
                  return r.read().decode('utf-8-sig')

          # Existing headwords in Lingosleep.
          existing={'Japanese':set(),'Korean':set()}
          for p in Path('src').glob('vocabulary*.ts'):
              text=p.read_text()
              for lang,target in re.findall(r'targetLanguage:\s*"(Japanese|Korean)"[^\n]*?targetText:\s*"([^"]+)"', text):
                  existing[lang].add(target.strip())
          noun=Path('src/vocabulary-noun-expansion.ts')
          if noun.exists():
              text=noun.read_text()
              for m in re.finditer(r'^\s*\["[^"]+",\s*"[^"]+",\s*"[^"]+",\s*"([^"]+)",\s*"[^"]+",\s*"[^"]+",\s*"([^"]+)"\],?$', text, re.M):
                  ja,ko=m.groups(); existing['Japanese'].add(ja); existing['Korean'].add(ko)

          # JLPT levels: use only standalone kanji headwords from N1-N3.
          jlpt={}
          for row in csv.DictReader(io.StringIO(get(JLPT))):
              k=row['Kanji'].strip(); rd=row['Reading'].strip(); lv=row['Level'].strip()
              if lv not in {'1','2','3'}: continue
              if not re.fullmatch(r'[一-龯々ヶ]+', k): continue
              jlpt.setdefault(k,[]).append((rd,int(lv)))

          tokenizer=dictionary.Dictionary().create()
          kks=kakasi()
          def kata_to_hira(s):
              return ''.join(chr(ord(c)-0x60) if 'ァ' <= c <= 'ヶ' else c for c in s)
          def reading_for(word):
              toks=tokenizer.tokenize(word)
              r=''.join(t.reading_form() for t in toks)
              return kata_to_hira(r)
          def romanize(hira):
              return ''.join(x['hepburn'] for x in kks.convert(hira))

          rows=[]; seen_ja=set(); seen_ko=set()
          for url in YONSEI:
              data=list(csv.DictReader(io.StringIO(get(url))))
              for r in data:
                  ko=r['korean'].strip(); hanja=r['origin_detail'].strip(); zh=r['chinese'].strip(); en=r['english'].strip()
                  if r['entry_kind']!='lexeme' or r['pos']!='명사' or r['review_status']!='high': continue
                  try: conf=float(r['match_confidence'] or 0)
                  except: conf=0
                  if conf < 0.90 or r['origin_type']!='hanja': continue
                  if not re.fullmatch(r'[一-龯々ヶ]{2,6}',hanja): continue
                  if not re.fullmatch(r'[가-힣]{2,8}',ko): continue
                  if hanja not in jlpt: continue
                  if hanja in existing['Japanese'] or ko in existing['Korean']: continue
                  # Pick the highest (hardest) JLPT level match for classification.
                  matches=sorted(jlpt[hanja], key=lambda x:x[1])
                  jlpt_reading,jlevel=matches[0]
                  level='Advanced' if jlevel in (1,2) else 'Intermediate'
                  # Prefer dictionary morphology for reading; retain JLPT reading for comparison.
                  rd=reading_for(hanja)
                  if not rd or re.search(r'[一-龯]',rd): continue
                  rom=romanize(rd)
                  if not rom: continue
                  if hanja in seen_ja or ko in seen_ko: continue
                  seen_ja.add(hanja); seen_ko.add(ko)
                  rows.append({
                    'level':level,'jlpt_level':jlevel,'volume':int(r['volume']),'source_order':int(r['source_order']),
                    'ja':hanja,'ja_reading':rd,'ja_jlpt_reading':jlpt_reading,'ja_romanization':rom,
                    'ko':ko,'zh':zh,'en':en,'confidence':conf
                  })

          # Favor curriculum order; for Advanced, favor higher Yonsei volumes, while keeping common N2 before obscure N1 where possible.
          inter=sorted((x for x in rows if x['level']=='Intermediate'), key=lambda x:(x['volume'],x['source_order'],len(x['ja'])))
          adv=sorted((x for x in rows if x['level']=='Advanced'), key=lambda x:(x['jlpt_level'],x['volume'],x['source_order']))
          selected=inter[:100]+adv[:150]
          Path('candidate-report.json').write_text(json.dumps({'counts':{'intermediate':len(inter),'advanced':len(adv),'selected':len(selected)},'selected':selected},ensure_ascii=False,indent=2))
          with Path('candidate-report.csv').open('w',newline='') as f:
              fields=['level','jlpt_level','volume','source_order','ja','ja_reading','ja_jlpt_reading','ja_romanization','ko','zh','en','confidence']
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(selected)
          print('INTERMEDIATE_CANDIDATES',len(inter))
          print('ADVANCED_CANDIDATES',len(adv))
          print('SELECTED',len(selected))
          print('FIRST_30')
          for x in selected[:30]: print(x)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: validated-headword-candidates
          path: |
            candidate-report.json
            candidate-report.csv
