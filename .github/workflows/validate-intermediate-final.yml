name: Validate final Intermediate expansion

on:
  push:
    paths:
      - '.github/workflows/validate-intermediate-final.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate Intermediate vocabulary data
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          new_path = Path('src/vocabulary-intermediate-curated-expansion.ts')
          text = new_path.read_text()
          rows = re.findall(r'^\s*\["([^"]+)", "(noun|verb|adj)", "([^"]*)", "([^"]*)", "([^"]+)", "([^"]+)", "([^"]+)", "([^"]+)"\],$', text, re.M)
          assert len(rows) == 250, f'Expected 250 concepts, got {len(rows)}'
          new_ja = [r[4] for r in rows]
          new_ko = [r[7] for r in rows]
          assert len(set(new_ja)) == 250
          assert len(set(new_ko)) == 250
          assert all(r[5].strip() and r[6].strip() for r in rows)
          assert all(not re.search(r'\s', x) for x in new_ja + new_ko)

          existing = {'Japanese': set(), 'Korean': set()}
          for path in Path('src').glob('vocabulary*.ts'):
            if path == new_path:
              continue
            source = path.read_text()
            for lang, target in re.findall(r'targetLanguage:\s*"(Japanese|Korean)"[\s\S]{0,500}?targetText:\s*"([^"]+)"', source):
              existing[lang].add(target)
            for raw_inner in re.findall(r'^\s*\[(".*")\],\s*$', source, re.M):
              try:
                row = json.loads('[' + raw_inner + ']')
              except Exception:
                continue
              if len(row) == 7:
                existing['Japanese'].add(row[3])
                existing['Korean'].add(row[6])
              elif len(row) == 8:
                existing['Japanese'].add(row[4])
                existing['Korean'].add(row[7])
          dup_ja = sorted(set(new_ja) & existing['Japanese'])
          dup_ko = sorted(set(new_ko) & existing['Korean'])
          assert not dup_ja, f'Japanese duplicates with existing vocabulary: {dup_ja[:20]}'
          assert not dup_ko, f'Korean duplicates with existing vocabulary: {dup_ko[:20]}'

          vocab = Path('src/vocabulary.ts').read_text()
          assert 'import { intermediateCuratedExpansion } from "./vocabulary-intermediate-curated-expansion";' in vocab
          assert '...intermediateCuratedExpansion,' in vocab
          print('Validated 250 globally fresh concepts / 500 Intermediate entries and vocabSeed wiring.')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
