name: Build exam vocabulary audit candidate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expand-exam-vocab-gaps-20260915.yml'
      - 'scripts/expand-exam-vocab-gaps.py'

permissions:
  contents: write

concurrency:
  group: exam-vocabulary-audit-candidate
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Install vocabulary tooling
        run: python -m pip install --disable-pip-version-check -q wordfreq pykakasi hangul-romanize mecab-python3 ipadic mecab-ko-dic

      - name: Generate and audit candidate vocabulary
        run: python scripts/expand-exam-vocab-gaps.py

      - name: Build app
        run: |
          npm ci
          npm run build

      - name: Stage candidate on audit branch
        shell: bash
        run: |
          rm -rf .tmp-krdict .tmp-jmdict-eng.tgz .tmp-krdict-yomitan-en.zip .tmp-krdict-yomitan-zh.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-exam-vocab-expansion.py scripts/expand-exam-vocab-gaps.py src/vocabulary-exam-expansion-ja.ts src/vocabulary-exam-expansion-ko.ts src/vocabulary.ts
          git commit -m "Candidate: expand exam vocabulary coverage"
          git push --force-with-lease origin HEAD:vocab-audit-20260915
