name: Validate final Basic vocabulary expansion

on:
  push:
    paths:
      - '.github/workflows/validate-basic-final.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate Basic vocabulary data
        run: |
          python - <<'PY'
          import re
          from collections import Counter
          from pathlib import Path

          expansion = Path('src/vocabulary-basic-expansion.ts').read_text()
          base = Path('src/vocabulary-basic.ts').read_text()
          seed = Path('src/vocabulary.ts').read_text()

          rows = re.findall(r'^\s*\["([^"]+)", "(noun|verb)", "([^"]*)", "([^"]*)", "([^"]+)", "([^"]+)", "([^"]+)", "([^"]+)"\],$', expansion, re.M)
          assert len(rows) == 250, f'Expected 250 concepts, got {len(rows)}'
          expected = {'food':35,'travel':35,'daily life':60,'work':30,'school':30,'anime/drama':15,'common verbs':45}
          assert Counter(r[0] for r in rows) == expected
          assert sum(1 for r in rows if r[1] == 'verb') == 45
          assert len({r[4] for r in rows}) == 250
          assert len({r[7] for r in rows}) == 250
          assert all(r[5].strip() for r in rows)
          assert all(r[6].strip() for r in rows)

          object_re = re.compile(r'targetLanguage:\s*"(Japanese|Korean)".*?targetText:\s*"([^"]+)".*?level:\s*"Basic"', re.S)
          existing = {'Japanese': set(), 'Korean': set()}
          for lang, target in object_re.findall(base):
              existing[lang].add(target)
          dupes = []
          for row in rows:
              if row[4] in existing['Japanese']:
                  dupes.append('Japanese: ' + row[4])
              if row[7] in existing['Korean']:
                  dupes.append('Korean: ' + row[7])
          assert not dupes, 'Duplicate target text against base vocabulary: ' + ', '.join(dupes[:20])

          assert 'import { basicCuratedExpansion } from "./vocabulary-basic-expansion";' in seed
          assert '...basicCuratedExpansion,' in seed
          print('Validated: 250 concepts / 500 entries, 45 verb concepts, no base duplicates, wired into vocabSeed.')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
