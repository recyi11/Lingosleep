name: One-shot repository cleanup

on:
  push:
    paths:
      - '.github/workflows/cleanup-generated-artifacts.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove stale generated artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main

          rm -rf graphify-out
          rm -f docs/audio-migration-continuation-prompt.md

          python - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text()
          text = text.replace(
              'See [DEPLOYMENT.md](./DEPLOYMENT.md) for deployment details. The generated code graph is available under `graphify-out/`.',
              'See [DEPLOYMENT.md](./DEPLOYMENT.md) for deployment details.'
          )
          path.write_text(text)
          PY

          rm -f .github/workflows/cleanup-generated-artifacts.yml
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to clean."
            exit 0
          fi
          git commit -m "Clean stale generated repository artifacts"
          git pull --rebase origin main
          git push origin HEAD:main
