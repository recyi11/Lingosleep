name: Fix noun readings and mobile word layout

on:
  push:
    paths:
      - '.github/workflows/fix-noun-reading-layout.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install converter
        run: pip install pykakasi
      - name: Apply patch
        run: python scripts/fix_noun_reading_layout.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vocabulary-noun-expansion.ts src/main.tsx src/styles.css
          git diff --cached --quiet && exit 0
          git commit -m "Fix noun readings and mobile word layout"
          git pull --rebase origin main
          git push origin main
