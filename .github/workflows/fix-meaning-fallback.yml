name: Fix meaning fallback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-meaning-fallback.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove fake related-meaning fallback
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
            Path('src/meaning-pairs.ts'): [
              ('  return `${value}, related ${value}`;', '  return value;'),
              ('  return `${value}，相关${value}`;', '  return value;'),
            ],
            Path('scripts/expand-vocabulary-meaning-pairs.mjs'): [
              ('  return `${value}, related ${value}`;', '  return value;'),
              ('  return `${value}，相关${value}`;', '  return value;'),
            ],
          }

          for path, pairs in replacements.items():
            text = path.read_text()
            for old, new in pairs:
              if old not in text and new not in text:
                raise SystemExit(f'Expected fallback not found in {path}: {old}')
              text = text.replace(old, new)
            path.write_text(text)
          PY
      - name: Verify no fake fallback remains
        run: |
          ! grep -R 'related ${value}' src/meaning-pairs.ts scripts/expand-vocabulary-meaning-pairs.mjs
          ! grep -R '相关${value}' src/meaning-pairs.ts scripts/expand-vocabulary-meaning-pairs.mjs
      - name: Verify build
        run: |
          npm ci
          npm run build
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/meaning-pairs.ts scripts/expand-vocabulary-meaning-pairs.mjs
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Stop fabricating related vocabulary meanings"
            git push origin HEAD:main
          fi
