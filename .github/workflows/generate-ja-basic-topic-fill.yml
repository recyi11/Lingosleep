name: Generate Japanese Basic topic fill

on:
  push:
    paths:
      - '.github/workflows/generate-ja-basic-topic-fill.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reading converter
        run: pip install pykakasi
      - name: Snapshot current runtime vocabulary
        run: |
          npx --yes tsx <<'TS'
          import fs from 'node:fs';
          import { vocabSeed } from './src/vocabulary.ts';
          import { jlptLevelByWord } from './src/jlpt-level-map.ts';
          const topics = ['daily life','travel','common verbs','numbers'];
          const basic = vocabSeed.filter(x => x.targetLanguage === 'Japanese' && x.level === 'Basic');
          const counts = Object.fromEntries(topics.map(topic => [
            topic,
            new Set(basic.filter(x => x.topic === topic).map(x => x.targetText.trim()).filter(Boolean)).size,
          ]));
          const existing = [...new Set(vocabSeed.filter(x => x.targetLanguage === 'Japanese').map(x => x.targetText.trim()).filter(Boolean))];
          fs.writeFileSync('/tmp/ja-basic-runtime.json', JSON.stringify({ counts, existing }));
          fs.writeFileSync('/tmp/jlpt-map.json', JSON.stringify(jlptLevelByWord));
          console.log({ counts, existingJapaneseHeadwords: existing.length });
          TS
      - name: Add supplemental curated candidates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('scripts/generate-ja-basic-topic-fill.py')
          text = path.read_text()
          marker = "runtime = json.loads(Path('/tmp/ja-basic-runtime.json').read_text())"
          extra = """extra_path = Path('scripts/ja-basic-topic-fill-extra.json')
if extra_path.exists():
    extra_candidates = json.loads(extra_path.read_text())
    for extra_topic, extra_rows in extra_candidates.items():
        CANDIDATES.setdefault(extra_topic, []).extend(tuple(row) for row in extra_rows)

"""
          if marker not in text:
              raise SystemExit('generator marker not found')
          path.write_text(text.replace(marker, extra + marker, 1))
          PY
      - name: Generate targeted fill
        run: python scripts/generate-ja-basic-topic-fill.py
      - name: Validate generated data
        run: |
          npx --yes tsx <<'TS'
          import { japaneseBasicTopicFill } from './src/vocabulary-basic-topic-fill-ja.ts';
          const expected = { 'daily life': 13, travel: 43, 'common verbs': 7, numbers: 66 };
          const counts = {};
          for (const item of japaneseBasicTopicFill) {
            if (item.targetLanguage !== 'Japanese' || item.level !== 'Basic') throw new Error(`Wrong language/level: ${item.id}`);
            if (!item.reading || !item.romanization || !item.meanings.English || !item.meanings['Simplified Chinese']) throw new Error(`Incomplete item: ${item.id}`);
            counts[item.topic] = (counts[item.topic] || 0) + 1;
          }
          if (new Set(japaneseBasicTopicFill.map(x => x.targetText)).size !== japaneseBasicTopicFill.length) throw new Error('Duplicate targetText inside fill');
          for (const [topic, count] of Object.entries(expected)) {
            if ((counts[topic] || 0) !== count) throw new Error(`${topic}: expected ${count}, got ${counts[topic] || 0}`);
          }
          if (japaneseBasicTopicFill.length !== 129) throw new Error(`Expected 129 entries, got ${japaneseBasicTopicFill.length}`);
          console.log('Validated targeted Japanese Basic fill:', counts);
          TS
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit generated vocabulary
        run: |
          git checkout -- scripts/generate-ja-basic-topic-fill.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vocabulary-basic-topic-fill-ja.ts
          git diff --cached --quiet && exit 0
          git commit -m "Fill Japanese Basic practical topic buckets"
          git pull --rebase origin main
          git push origin main
