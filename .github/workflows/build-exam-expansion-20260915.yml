name: Build exam vocabulary expansion
# rerun after candidate dedupe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-exam-expansion-20260915.yml'
      - 'scripts/build-exam-vocab-expansion.py'

permissions:
  contents: write

concurrency:
  group: build-exam-vocabulary-expansion
  cancel-in-progress: false

jobs:
  build-expansion:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install vocabulary tooling
        run: python -m pip install --disable-pip-version-check -q wordfreq pykakasi hangul-romanize mecab-python3 ipadic mecab-ko-dic

      - name: Generate 1500 exam-oriented headwords
        run: python scripts/build-exam-vocab-expansion.py

      - name: Audit generated vocabulary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          src = Path('src')
          ja = (src/'vocabulary-exam-expansion-ja.ts').read_text()
          ko = (src/'vocabulary-exam-expansion-ko.ts').read_text()

          assert ja.count('targetLanguage: "Japanese"') == 800
          assert ja.count('examLevel: "N3"') == 200
          assert ja.count('examLevel: "N2"') == 350
          assert ja.count('examLevel: "N1"') == 250
          assert ko.count('targetLanguage: "Korean"') == 700
          assert ko.count('koreanGrade: "중급"') == 250
          assert ko.count('koreanGrade: "고급"') == 450

          ja_words = re.findall(r'targetText: "([^"]+)"', ja)
          ko_words = re.findall(r'targetText: "([^"]+)"', ko)
          assert len(ja_words) == len(set(ja_words)) == 800
          assert len(ko_words) == len(set(ko_words)) == 700
          assert all(not re.search(r'\s', w) for w in ja_words + ko_words)
          assert 'English: ""' not in ja and 'English: ""' not in ko
          assert '"Simplified Chinese": ""' not in ja and '"Simplified Chinese": ""' not in ko

          other = ''
          for p in src.glob('vocabulary*.ts'):
              if p.name in {'vocabulary.ts', 'vocabulary-exam-expansion-ja.ts', 'vocabulary-exam-expansion-ko.ts'}:
                  continue
              other += '\n' + p.read_text()
          old_ja = set(re.findall(r'targetLanguage:\s*"Japanese"\s*,\s*targetText:\s*"([^"]+)"', other))
          old_ko = set(re.findall(r'targetLanguage:\s*"Korean"\s*,\s*targetText:\s*"([^"]+)"', other))
          assert not (set(ja_words) & old_ja)
          assert not (set(ko_words) & old_ko)

          print('AUDIT_OK Japanese=800 (N3=200 N2=350 N1=250) Korean=700 (중급=250 고급=450)')
          PY

      - name: Build app
        run: |
          npm ci
          npm run build

      - name: Commit only if main stayed unchanged
        shell: bash
        run: |
          rm -rf .tmp-krdict
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$BASE_SHA" ]; then
            echo "main changed while vocabulary was being generated; refusing a stale commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vocabulary-exam-expansion-ja.ts src/vocabulary-exam-expansion-ko.ts src/vocabulary.ts
          git commit -m "Add 1500 exam-oriented Japanese and Korean words"
          git push origin HEAD:main
