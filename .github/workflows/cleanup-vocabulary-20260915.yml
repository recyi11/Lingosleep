              if not raw:
                  continue
              level, ja, ko, zh, en = [x.strip() for x in raw.split('|', 4)]
              if len(kept[level]) >= level_targets[level]:
                  continue
              if ja in used_ja or ko in used_ko or not standalone(ja) or not standalone(ko):
                  continue
              rd = jp_reading(ja)
              kept[level].append({
                  'ja': ja,
                  'ko': ko,
                  'en': en,
                  'zh': zh,
                  'reading': rd,
                  'romanization': jp_romanization(rd),
              })
              used_ja.add(ja)
              used_ko.add(ko)

          for level, target in level_targets.items():
              if len(kept[level]) != target:
                  raise RuntimeError(f'Validated refill failed for {level}: {len(kept[level])}/{target}')

          lines = [
              'import type { VocabItem } from "./vocabulary";',
              '',
              '// 500 standalone headwords: 200 Intermediate + 300 Advanced.',
              '// Globally de-duplicated against all earlier vocabulary batches; no phrase targets.',
              'export const validatedHeadwordExpansion: VocabItem[] = [',
          ]
          for level in ('Intermediate', 'Advanced'):
              levkey = level.lower()
              for idx, item in enumerate(kept[level], 1):
                  ja, ko = item['ja'], item['ko']
                  en, zh = item['en'], item['zh']
                  lines.extend([
                      '  {',
                      f'    id: {q(f"ja-validated-{levkey}-{idx:03d}")},',
                      '    targetLanguage: "Japanese",',
                      f'    targetText: {q(ja)},',
                      f'    meanings: {{ English: {q(en)}, "Simplified Chinese": {q(zh)} }},',
                      f'    reading: {q(item["reading"])},',
                      f'    romanization: {q(item["romanization"])},',
                      f'    level: {q(level)},',
                      '    topic: "JLPT",',
                      f'    exampleSentence: {q(f"「{ja}」の意味と使い方を復習します。")},',
                      '    exampleTranslations: { English: "We review the meaning and usage of this word.", "Simplified Chinese": "我们复习这个词的含义和用法。" },',
                      '  },',
                      '  {',
                      f'    id: {q(f"ko-validated-{levkey}-{idx:03d}")},',
                      '    targetLanguage: "Korean",',
                      f'    targetText: {q(ko)},',
                      f'    meanings: {{ English: {q(en)}, "Simplified Chinese": {q(zh)} }},',
                      f'    reading: {q(ko)},',
                      '    romanization: "",',
                      f'    level: {q(level)},',
                      '    topic: "TOPIK",',
                      f'    exampleSentence: {q(f"“{ko}”의 뜻과 쓰임을 복습합니다.")},',
                      '    exampleTranslations: { English: "We review the meaning and usage of this word.", "Simplified Chinese": "我们复习这个词的含义和用法。" },',
                      '  },',
                  ])
          lines.append('];')
          validated_path.write_text('\n'.join(lines) + '\n')

          # ---------------- Strict audit of all new expansion targets ----------------
          audit_used = target_words_from_object_files(old_files)
          audit_ja = set(audit_used['Japanese'])
          audit_ko = set(audit_used['Korean'])
          errors = []

          def audit_word(lang, word, where):
              seen = audit_ja if lang == 'Japanese' else audit_ko
              if not standalone(word):
                  errors.append(f'phrase target: {lang} {word} at {where}')
              if word in seen:
                  errors.append(f'duplicate target: {lang} {word} at {where}')
              seen.add(word)

          final_basic_text = basic_path.read_text()
          _, final_basic = parse_array(final_basic_text, 'const rows: BasicRow[]', 8)
          if len(final_basic) != 250:
              errors.append(f'basic count {len(final_basic)} != 250')
          for i, row in enumerate(final_basic, 1):
              audit_word('Japanese', row[4], f'basic:{i}')
              audit_word('Korean', row[7], f'basic:{i}')

          final_noun_text = noun_path.read_text()
          _, final_inter = parse_array(final_noun_text, 'const intermediateNouns: NounPair[]', 7)
          _, final_adv = parse_array(final_noun_text, 'const advancedNouns: NounPair[]', 7)
          if len(final_inter) != 125 or len(final_adv) != 125:
              errors.append(f'noun counts {len(final_inter)}/{len(final_adv)} != 125/125')
          for label, rows in [('intermediate', final_inter), ('advanced', final_adv)]:
              for i, row in enumerate(rows, 1):
                  audit_word('Japanese', row[3], f'noun-{label}:{i}')
                  audit_word('Korean', row[6], f'noun-{label}:{i}')

          final_validated = validated_path.read_text()
          obj_pat = re.compile(r'targetLanguage:\s*"(Japanese|Korean)"\s*,\s*targetText:\s*"([^"]+)"')
          objs = obj_pat.findall(final_validated)
          if len(objs) != 500:
              errors.append(f'validated object count {len(objs)} != 500')
          for i, (lang, word) in enumerate(objs, 1):
              audit_word(lang, word, f'validated:{i}')

          forbidden = [
              '"반 친구"', '"수하물카트"', '"학생식당"', '"배경설정"',
              '"자격증명"', '"동료평가"', '"탑승순서"', '"도착로비"',
              '"캐릭터디자인"', '"근본원인"', '"권한위임"',
          ]
          combined = final_basic_text + '\n' + final_noun_text + '\n' + final_validated
          for token in forbidden:
              if token in combined:
                  errors.append(f'forbidden phrase-like token remains: {token}')
          if '"瓶", "かめ"' in final_basic_text:
              errors.append('bad bottle reading remains')
          if 'あんないじょ' in final_basic_text:
              errors.append('bad 案内所 reading remains')
          if re.search(r'광경를|노인라는|\w+를 문맥에서 확인해요', final_validated):
              errors.append('unsafe Korean particle template remains')

          if errors:
              print('\n'.join(errors[:200]))
              raise RuntimeError(f'Final vocabulary audit failed with {len(errors)} errors')

          print('CLEANUP_OK')
          print('basic pairs:', len(final_basic), 'dropped:', len(dropped_basic), 'corrected:', len(basic_changes))
          print('noun pairs:', len(final_inter), '+', len(final_adv), 'normalized:', len(noun_changes))
          print('validated entries:', len(objs), 'Intermediate:', len(kept['Intermediate']) * 2, 'Advanced:', len(kept['Advanced']) * 2)
          print('unique expansion targets Japanese:', len(audit_ja) - len(audit_used['Japanese']))
          print('unique expansion targets Korean:', len(audit_ko) - len(audit_used['Korean']))
          PY

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit cleaned vocabulary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vocabulary-basic-expansion.ts src/vocabulary-noun-expansion.ts src/vocabulary-validated-expansion.ts
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "Clean and deduplicate vocabulary expansions"
            git push origin HEAD:main
          fi
