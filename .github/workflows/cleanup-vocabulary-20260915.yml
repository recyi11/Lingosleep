name: Cleanup vocabulary 2026-09-15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-vocabulary-20260915.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Install vocabulary validators
        run: pip install -q sudachipy sudachidict_core pykakasi

      - name: Clean recent vocabulary expansions
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          from collections import defaultdict
          from sudachipy import dictionary
          from pykakasi import kakasi

          SRC = Path('src')
          tokenizer = dictionary.Dictionary().create()
          kks = kakasi()

          def kata_to_hira(s: str) -> str:
              return ''.join(chr(ord(c) - 0x60) if 'ァ' <= c <= 'ヶ' else c for c in s)

          def jp_reading(word: str) -> str:
              return kata_to_hira(''.join(t.reading_form() for t in tokenizer.tokenize(word)))

          def jp_romanization(reading: str) -> str:
              return ''.join(x['hepburn'] for x in kks.convert(reading))

          def q(s: str) -> str:
              return json.dumps(s, ensure_ascii=False)

          def target_words_from_object_files(names):
              out = {'Japanese': set(), 'Korean': set()}
              pat = re.compile(r'targetLanguage:\s*"(Japanese|Korean)"\s*,\s*targetText:\s*"([^"]+)"')
              for name in names:
                  text = (SRC / name).read_text()
                  for lang, word in pat.findall(text):
                      out[lang].add(word)
              return out

          def parse_array(text: str, declaration: str, expected_fields: int):
              pat = re.compile(r'(' + re.escape(declaration) + r'\s*=\s*\[\n)([\s\S]*?)(\n\];)')
              m = pat.search(text)
              if not m:
                  raise RuntimeError(f'Cannot find array: {declaration}')
              rows = []
              for raw in m.group(2).splitlines():
                  s = raw.strip()
                  if not s.startswith('['):
                      continue
                  vals = json.loads(s.rstrip(','))
                  if len(vals) != expected_fields:
                      raise RuntimeError(f'Bad row in {declaration}: {s}')
                  rows.append(vals)
              return m, rows

          def replace_array(text: str, declaration: str, rows):
              pat = re.compile(r'(' + re.escape(declaration) + r'\s*=\s*\[\n)([\s\S]*?)(\n\];)')
              m = pat.search(text)
              if not m:
                  raise RuntimeError(f'Cannot replace array: {declaration}')
              body = '\n'.join('  ' + json.dumps(row, ensure_ascii=False) + ',' for row in rows)
              return text[:m.start(2)] + body + text[m.end(2):]

          def standalone(word: str) -> bool:
              return bool(word) and not re.search(r'[\s,，、;/|]', word)

          old_files = [
              'vocabulary-basic.ts',
              'vocabulary-intermediate.ts',
              'vocabulary-advanced.ts',
              'vocabulary-expansion.ts',
          ]
          old = target_words_from_object_files(old_files)
          used_ja = set(old['Japanese'])
          used_ko = set(old['Korean'])

          # ---------------- Basic expansion ----------------
          basic_path = SRC / 'vocabulary-basic-expansion.ts'
          basic_text = basic_path.read_text()
          _, basic_rows = parse_array(basic_text, 'const rows: BasicRow[]', 8)
          original_basic_count = len(basic_rows)
          basic_changes = []

          def normalize_basic(row):
              topic, pos, en, zh, ja, jr, jrom, ko = row
              before = tuple(row)

              if ja == '袋' and ko == '봉투':
                  ko = '봉지'
              if ja == '瓶' and en == 'bottle':
                  jr, jrom = 'びん', 'bin'
              if ja == '案内所' and jr == 'あんないじょ':
                  jr, jrom = 'あんないしょ', 'annaisho'
              if ja == 'バス停' and ko == '버스정류장':
                  en, zh, ja, jr, jrom, ko = 'stop', '停靠站', '停留所', 'ていりゅうじょ', 'teiryuujo', '정류장'
              if ja == '同級生' and ko == '반 친구':
                  ko = '동급생'
              if ja == '取る' and ko == '가져가다':
                  en, zh, ko = 'to take / pick', '拿取', '집다'
              if ja == '持つ' and ko == '들다':
                  en, zh, ko = 'to hold', '握住', '쥐다'

              out = [topic, pos, en, zh, ja, jr, jrom, ko]
              if tuple(out) != before:
                  basic_changes.append((before, tuple(out)))
              return out

          cleaned_basic = []
          dropped_basic = []
          for raw in basic_rows:
              row = normalize_basic(raw)
              ja, ko = row[4], row[7]
              if not standalone(ja) or not standalone(ko):
                  dropped_basic.append(('phrase', ja, ko))
                  continue
              if ja in used_ja or ko in used_ko:
                  dropped_basic.append(('duplicate', ja, ko))
                  continue
              used_ja.add(ja)
              used_ko.add(ko)
              cleaned_basic.append(row)

          BASIC_RESERVE = '''
          food|noun|bowl|碗|茶碗|그릇
          food|noun|plate|盘子|皿|접시
          food|noun|chopsticks|筷子|箸|젓가락
          food|noun|spoon|勺子|スプーン|숟가락
          food|noun|fork|叉子|フォーク|포크
          food|noun|knife|餐刀|ナイフ|나이프
          food|noun|cup|杯子|コップ|컵
          food|noun|pot|锅|鍋|냄비
          food|noun|frying pan|平底锅|フライパン|프라이팬
          food|noun|refrigerator|冰箱|冷蔵庫|냉장고
          food|noun|freezer|冷冻柜|冷凍庫|냉동고
          food|noun|kettle|水壶|やかん|주전자
          food|noun|tray|托盘|トレー|쟁반
          food|noun|menu|菜单|メニュー|메뉴
          food|noun|dessert|甜点|デザート|디저트
          travel|noun|crosswalk|人行横道|横断歩道|횡단보도
          travel|noun|parking lot|停车场|駐車場|주차장
          travel|noun|traffic jam|堵车|渋滞|정체
          travel|noun|police box|派出所|交番|파출소
          travel|noun|tollgate|收费站|料金所|요금소
          travel|noun|ferry|渡轮|フェリー|페리
          travel|noun|passenger|乘客|乗客|승객
          travel|noun|ship|船|船|배
          travel|noun|intersection|十字路口|十字路|사거리
          travel|noun|bridge|桥|橋|다리
          travel|noun|tunnel|隧道|トンネル|터널
          travel|noun|traffic light|红绿灯|信号|신호등
          travel|noun|station|车站|駅|역
          travel|noun|subway|地铁|地下鉄|지하철
          travel|noun|taxi|出租车|タクシー|택시
          daily life|noun|soap|肥皂|石鹸|비누
          daily life|noun|toothbrush|牙刷|歯ブラシ|칫솔
          daily life|noun|bathroom|浴室|浴室|욕실
          daily life|noun|vacuum cleaner|吸尘器|掃除機|청소기
          daily life|noun|microwave|微波炉|電子レンジ|전자레인지
          daily life|noun|washing machine|洗衣机|洗濯機|세탁기
          daily life|noun|medicine box|药箱|薬箱|약상자
