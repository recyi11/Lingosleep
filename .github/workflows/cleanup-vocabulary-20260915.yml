          daily life|noun|ceiling|天花板|天井|천장
          daily life|noun|slippers|拖鞋|スリッパ|슬리퍼
          daily life|noun|pajamas|睡衣|パジャマ|잠옷
          daily life|noun|apron|围裙|エプロン|앞치마
          daily life|noun|basket|篮子|籠|바구니
          daily life|noun|curtain|窗帘|カーテン|커튼
          daily life|noun|battery|电池|電池|배터리
          daily life|noun|remote control|遥控器|リモコン|리모컨
          work|noun|desk|办公桌|机|책상
          work|noun|chair|椅子|椅子|의자
          work|noun|stamp|印章|印鑑|도장
          work|noun|warehouse|仓库|倉庫|창고
          work|noun|store|店铺|店舗|매장
          work|noun|factory|工厂|工場|공장
          work|noun|president|社长|社長|사장
          work|noun|section manager|课长|課長|과장
          work|noun|company worker|公司职员|会社員|회사원
          work|noun|memo|便签|メモ|메모
          work|noun|stapler|订书机|ホチキス|스테이플러
          work|noun|envelope|信封|封筒|봉투
          work|noun|clip|夹子|クリップ|클립
          work|noun|label|标签|ラベル|라벨
          school|noun|blackboard|黑板|黒板|칠판
          school|noun|semester|学期|学期|학기
          school|noun|subject|科目|科目|과목
          school|noun|school gate|校门|校門|교문
          school|noun|pencil case|铅笔盒|筆箱|필통
          school|noun|principal|校长|校長|교장
          school|noun|professor|教授|教授|교수
          school|noun|lecturer|讲师|講師|강사
          school|noun|grading|评分|採点|채점
          school|noun|credit|学分|単位|학점
          school|noun|locker|储物柜|ロッカー|사물함
          school|noun|auditorium|礼堂|講堂|강당
          school|noun|club|社团|部活|동아리
          anime/drama|noun|stage|舞台|舞台|무대
          anime/drama|noun|acting|演技|演技|연기
          anime/drama|noun|preview|预告|予告|예고
          anime/drama|noun|broadcast|播出|放送|방송
          anime/drama|noun|audience|观众|観客|관객
          anime/drama|noun|cinema|电影院|映画館|영화관
          anime/drama|noun|performance|演出活动|上演|공연
          anime/drama|noun|screen|银幕|スクリーン|스크린
          anime/drama|noun|actor|演员|俳優|배우
          anime/drama|noun|actress|女演员|女優|여배우
          anime/drama|noun|singer|歌手|歌手|가수
          anime/drama|noun|trailer|预告片|予告編|예고편
          common verbs|verb|to open|打开|開ける|열다
          common verbs|verb|to close|关闭|閉める|닫다
          common verbs|verb|to press|按下|押す|누르다
          common verbs|verb|to pull|拉|引く|당기다
          common verbs|verb|to carry|搬运|運ぶ|나르다
          common verbs|verb|to wrap|包裹|包む|싸다
          common verbs|verb|to wash|清洗|洗う|씻다
          common verbs|verb|to dry|晾干|乾かす|말리다
          common verbs|verb|to wait|等待|待つ|기다리다
          common verbs|verb|to search|寻找|探す|찾다
          common verbs|verb|to sit|坐下|座る|앉다
          common verbs|verb|to stand|站立|立つ|서다
          '''

          for raw in BASIC_RESERVE.splitlines():
              if len(cleaned_basic) >= original_basic_count:
                  break
              raw = raw.strip()
              if not raw:
                  continue
              topic, pos, en, zh, ja, ko = [x.strip() for x in raw.split('|')]
              if ja in used_ja or ko in used_ko or not standalone(ja) or not standalone(ko):
                  continue
              jr = jp_reading(ja)
              row = [topic, pos, en, zh, ja, jr, jp_romanization(jr), ko]
              used_ja.add(ja)
              used_ko.add(ko)
              cleaned_basic.append(row)

          if len(cleaned_basic) != original_basic_count:
              raise RuntimeError(f'Basic refill failed: {len(cleaned_basic)}/{original_basic_count}')

          basic_text = replace_array(basic_text, 'const rows: BasicRow[]', cleaned_basic)
          basic_path.write_text(basic_text)

          # ---------------- Intermediate / Advanced noun expansion ----------------
          noun_path = SRC / 'vocabulary-noun-expansion.ts'
          noun_text = noun_path.read_text()
          _, inter_rows = parse_array(noun_text, 'const intermediateNouns: NounPair[]', 7)
          _, adv_rows = parse_array(noun_text, 'const advancedNouns: NounPair[]', 7)
          inter_target, adv_target = len(inter_rows), len(adv_rows)
          noun_changes = []
          drop_korean = {'탑승순서', '도착로비', '캐릭터디자인', '근본원인', '권한위임', '동료평가'}

          def normalize_noun(row):
              topic, en, zh, ja, jr, jrom, ko = row
              before = tuple(row)
              if ko in drop_korean:
                  noun_changes.append(('drop', before))
                  return None

              if ko == '수하물카트':
                  en, zh, ja, jr, jrom, ko = 'cart', '手推车', 'カート', 'かーと', 'kaato', '카트'
              elif ko == '학생식당':
                  en, zh, ja, jr, jrom, ko = 'cafeteria', '食堂', '食堂', 'しょくどう', 'shokudou', '식당'
              elif ko == '배경설정':
                  en, zh, ja, jr, jrom, ko = 'setting', '设定', '設定', 'せってい', 'settei', '설정'
              elif ko == '회복탄력성':
                  en, zh, ja, jr, jrom, ko = 'resilience', '恢复力', '回復力', 'かいふくりょく', 'kaifukuryoku', '회복력'
              elif ko == '보존기간':
                  en, zh, ja, jr, jrom, ko = 'retention', '保持', '保持', 'ほじ', 'hoji', '유지'
              elif ko == '자격증명':
                  en, zh, ja, jr, jrom, ko = 'authorization', '权限', '権限', 'けんげん', 'kengen', '권한'
              elif ko == '인구동태':
                  en, zh, ja, jr, jrom, ko = 'demography', '人口学', '人口学', 'じんこうがく', 'jinkougaku', '인구학'

              if ja == '冗長性' and ko == '이중화':
                  ko = '중복성'
              if ja == '庇護' and ko == '망명':
                  en, zh, ja, jr, jrom, ko = 'exile', '亡命', '亡命', 'ぼうめい', 'boumei', '망명'
              if ja == '格差' and ko == '불평등':
                  en, zh, ja, jr, jrom, ko = 'inequality', '不平等', '不平等', 'ふびょうどう', 'fubyoudou', '불평등'
              if ja == 'プライバシー' and ko == '사생활':
                  ko = '프라이버시'
              if ja == '住宅ローン' and ko == '주택대출':
                  en, zh, ja, jr, jrom, ko = 'loan', '贷款', 'ローン', 'ろーん', 'roon', '대출'
              if ja == '履修登録' and ko == '수강신청':
                  en, zh = 'course registration', '选课注册'
              if ja == '助成金' and ko == '연구비':
                  en, zh, ja, jr, jrom, ko = 'research funding', '研究经费', '研究費', 'けんきゅうひ', 'kenkyuuhi', '연구비'
              if ja == '美術' and ko == '미술' and en == 'set design':
                  en, zh = 'art', '美术'
              if ja == 'テンポ' and ko == '호흡':
                  ko = '템포'
              if ja == '含意' and ko == '함의':
                  en, zh = 'implication', '含意'
              if ja == '神話' and ko == '신화' and en == 'mythology':
                  en, zh = 'myth', '神话'
              if ja == 'シリーズ' and ko == '프랜차이즈':
                  en, zh, ko = 'series', '系列', '시리즈'
              if ja == '引き' and ko == '클리프행어':
                  ja, jr, jrom = 'クリフハンガー', 'くりふはんがー', 'kurifuhangaa'

              out = [topic, en, zh, ja, jr, jrom, ko]
              if tuple(out) != before:
                  noun_changes.append((before, tuple(out)))
              return out

          def clean_noun_rows(rows):
              result = []
              for raw in rows:
                  row = normalize_noun(raw)
                  if row is None:
                      continue
                  ja, ko = row[3], row[6]
                  if not standalone(ja) or not standalone(ko):
                      continue
                  if ja in used_ja or ko in used_ko:
                      continue
                  used_ja.add(ja)
                  used_ko.add(ko)
                  result.append(row)
              return result

          clean_inter = clean_noun_rows(inter_rows)
          clean_adv = clean_noun_rows(adv_rows)

          NOUN_INTER_RESERVE = '''
