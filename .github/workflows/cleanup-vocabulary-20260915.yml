          school|graduation|毕业|卒業|졸업
          school|leave of absence|休学|休学|휴학
          school|return to school|复学|復学|복학
          school|teaching material|教材|教材|교재
          school|curriculum|课程|課程|과정
          school|degree|学位|学位|학위
          anime/drama|screening|上映|上映|상영
          anime/drama|viewer|观众|視聴者|시청자
          anime/drama|broadcast|放映|放映|방영
