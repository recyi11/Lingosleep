          def fill_noun(rows, target, data):
              for raw in data.splitlines():
                  if len(rows) >= target:
                      break
                  raw = raw.strip()
                  if not raw:
                      continue
                  topic, en, zh, ja, ko = [x.strip() for x in raw.split('|')]
                  if ja in used_ja or ko in used_ko or not standalone(ja) or not standalone(ko):
                      continue
                  jr = jp_reading(ja)
                  rows.append([topic, en, zh, ja, jr, jp_romanization(jr), ko])
                  used_ja.add(ja)
                  used_ko.add(ko)
              if len(rows) != target:
                  raise RuntimeError(f'Noun refill failed: {len(rows)}/{target}')

          fill_noun(clean_inter, inter_target, NOUN_INTER_RESERVE)
          fill_noun(clean_adv, adv_target, NOUN_ADV_RESERVE)

          noun_text = replace_array(noun_text, 'const intermediateNouns: NounPair[]', clean_inter)
          noun_text = replace_array(noun_text, 'const advancedNouns: NounPair[]', clean_adv)
          noun_path.write_text(noun_text)

          # ---------------- Validated Intermediate/Advanced 500 ----------------
          validated_path = SRC / 'vocabulary-validated-expansion.ts'
          validated_text = validated_path.read_text()
          block_pat = re.compile(r'\{\s*id:\s*"([^"]+)"[\s\S]*?\n\s*\},')
          groups = defaultdict(dict)

          for block in block_pat.findall(validated_text):
              pass

          # Re-scan while retaining the whole block.
          full_block_pat = re.compile(r'\{\s*id:\s*"([^"]+)"[\s\S]*?\n\s*\},')
          for m in full_block_pat.finditer(validated_text):
              block = m.group(0)
              ident = m.group(1)
              im = re.fullmatch(r'(ja|ko)-validated-(intermediate|advanced)-(\d+)', ident)
              if not im:
                  continue
              lc, levkey, num = im.groups()
              level = 'Intermediate' if levkey == 'intermediate' else 'Advanced'
              def field(name):
                  mm = re.search(rf'{name}:\s*"([^"]*)"', block)
                  return mm.group(1) if mm else ''
              target = field('targetText')
              reading = field('reading')
              romanization = field('romanization')
              mm = re.search(r'meanings:\s*\{\s*English:\s*"([^"]*)"\s*,\s*"Simplified Chinese":\s*"([^"]*)"\s*\}', block)
              if not mm:
                  raise RuntimeError(f'Cannot parse meanings for {ident}')
              en, zh = mm.groups()
              groups[(level, int(num))][lc] = {
                  'target': target,
                  'reading': reading,
                  'romanization': romanization,
                  'en': en,
                  'zh': zh,
              }

          level_targets = {'Intermediate': 100, 'Advanced': 150}
          kept = {'Intermediate': [], 'Advanced': []}
          bad_validated_ja = {'自殺', '境遇', '課外', '直後', '就業', '年間'}
          bad_validated_pairs = {
              ('輸入', '수입품'), ('保険', '보험료'), ('文化', '문화재'),
              ('改革', '개혁안'), ('改正', '개정안'), ('独立', '독립성'),
              ('支援', '지원책'), ('対応', '대응책'), ('安全性', '안전성평가'),
              ('報道', '보도자료'), ('上映', '상영작'), ('距離', '거리감'),
          }

          for key in sorted(groups, key=lambda x: (0 if x[0] == 'Intermediate' else 1, x[1])):
              level, _ = key
              pair = groups[key]
              if 'ja' not in pair or 'ko' not in pair:
                  continue
              ja, ko = pair['ja']['target'], pair['ko']['target']
              if ja in bad_validated_ja or (ja, ko) in bad_validated_pairs:
                  continue
              if not standalone(ja) or not standalone(ko):
                  continue
              if ja in used_ja or ko in used_ko:
                  continue
              kept[level].append({
                  'ja': ja,
                  'ko': ko,
                  'en': pair['ja']['en'],
                  'zh': pair['ja']['zh'],
                  'reading': pair['ja']['reading'] or jp_reading(ja),
                  'romanization': pair['ja']['romanization'] or jp_romanization(jp_reading(ja)),
              })
              used_ja.add(ja)
              used_ko.add(ko)

