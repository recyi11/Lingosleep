name: Validate Japanese Basic topic fill

on:
  push:
    paths:
      - '.github/workflows/validate-ja-basic-topic-fill.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate runtime topic buckets
        run: |
          npx --yes tsx <<'TS'
          import { vocabSeed } from './src/vocabulary.ts';
          import { japaneseBasicTopicFill } from './src/vocabulary-basic-topic-fill-ja.ts';
          const expected = { 'daily life': 120, travel: 100, 'common verbs': 100, numbers: 100 };
          const basic = vocabSeed.filter(x => x.targetLanguage === 'Japanese' && x.level === 'Basic');
          const counts = Object.fromEntries(Object.keys(expected).map(topic => [
            topic,
            new Set(basic.filter(x => x.topic === topic).map(x => x.targetText)).size,
          ]));
          for (const [topic, minimum] of Object.entries(expected)) {
            if ((counts[topic] || 0) < minimum) throw new Error(`${topic}: expected at least ${minimum}, got ${counts[topic] || 0}`);
          }
          if (japaneseBasicTopicFill.length !== 129) throw new Error(`Expected 129 new entries, got ${japaneseBasicTopicFill.length}`);
          const levels = ['Basic','Intermediate','Advanced'];
          const languages = ['Japanese','Korean'];
          const matrix = {};
          for (const level of levels) {
            matrix[level] = {};
            for (const language of languages) {
              matrix[level][language] = new Set(vocabSeed.filter(x => x.level === level && x.targetLanguage === language).map(x => x.targetText)).size;
            }
          }
          console.log('JA_BASIC_BUCKETS=' + JSON.stringify(counts));
          console.log('VOCAB_MATRIX=' + JSON.stringify(matrix));
          TS
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
