name: Regenerate balanced Basic vocabulary

on:
  push:
    paths:
      - 'scripts/regenerate_basic_balanced.py'
      - '.github/workflows/regenerate-basic-balanced.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install reading converter
        run: pip install pykakasi
      - name: Regenerate balanced Basic expansion
        run: python scripts/regenerate_basic_balanced.py
      - name: Validate balanced expansion
        run: |
          python - <<'PY'
          import re
          from collections import Counter
          from pathlib import Path
          text = Path('src/vocabulary-basic-expansion.ts').read_text()
          rows = re.findall(r'^\s*\["([^"]+)", "(noun|verb)", "([^"]*)", "([^"]*)", "([^"]+)", "([^"]+)", "([^"]+)", "([^"]+)"\],$', text, re.M)
          assert len(rows) == 250, len(rows)
          counts = Counter(r[0] for r in rows)
          expected = {'food':35,'travel':35,'daily life':60,'work':30,'school':30,'anime/drama':15,'common verbs':45}
          assert counts == expected, (counts, expected)
          assert len({r[4] for r in rows}) == 250
          assert len({r[7] for r in rows}) == 250
          assert all(r[5].strip() for r in rows)
          assert all(r[6].strip() for r in rows)
          print('Validated balanced 250 concepts / 500 Basic entries:', counts)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit balanced vocabulary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vocabulary-basic-expansion.ts
          git diff --cached --quiet && exit 0
          git commit -m "Balance Basic vocabulary expansion"
          git pull --rebase origin main
          git push origin main
