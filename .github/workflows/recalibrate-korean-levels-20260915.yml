name: Recalibrate Korean proficiency levels
on:
  push:
    paths:
      - '.github/workflows/recalibrate-korean-levels-20260915.yml'
permissions:
  contents: write
jobs:
  recalibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Generate Korean learner-level map and wire normalization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, urllib.request, xml.etree.ElementTree as ET

          src = Path('src')
          urls = [
              'https://raw.githubusercontent.com/studioego/krdict-converted/master/upstream/0.xml',
              'https://raw.githubusercontent.com/studioego/krdict-converted/master/upstream/1.xml',
          ]
          tmp = Path('/tmp/krdict')
          tmp.mkdir(exist_ok=True)
          rank = {'초급': 0, '중급': 1, '고급': 2}
          mapping = {}

          def local(tag):
              return tag.rsplit('}', 1)[-1]

          def direct_feat(node, name):
              for child in node:
                  if local(child.tag) != 'feat':
                      continue
                  att = child.attrib.get('att', child.attrib.get('name', ''))
                  if att.replace('_','').replace('-','').lower() != name.replace('_','').replace('-','').lower():
                      continue
                  return child.attrib.get('val', child.attrib.get('value', '')) or ''.join(child.itertext())
              return None

          for idx, url in enumerate(urls):
              path = tmp / f'{idx}.xml'
              print('Downloading', url)
              urllib.request.urlretrieve(url, path)
              context = ET.iterparse(path, events=('start', 'end'))
              _, root = next(context)
              for event, elem in context:
                  if event != 'end' or local(elem.tag) != 'LexicalEntry':
                      continue
                  grade = direct_feat(elem, 'vocabularyLevel')
                  if grade not in rank:
                      elem.clear(); root.clear(); continue
                  word = None
                  for child in elem:
                      if local(child.tag) != 'Lemma':
                          continue
                      word = direct_feat(child, 'writtenForm')
                      if word:
                          break
                  if word:
                      word = word.strip()
                      old = mapping.get(word)
                      if old is None or rank[grade] < rank[old]:
                          mapping[word] = grade
                  elem.clear(); root.clear()

          items = ',\n'.join(
              f'  {json.dumps(k, ensure_ascii=False)}: {json.dumps(v, ensure_ascii=False)}'
              for k, v in sorted(mapping.items())
          )
          out = '''// Generated from the National Institute of Korean Language Korean Basic Dictionary data.\n// Grades are learner-proficiency levels (초급/중급/고급), not exact official TOPIK item levels.\nexport type KoreanGrade = "초급" | "중급" | "고급";\n\nexport const koreanGradeByWord: Record<string, KoreanGrade> = {\n''' + items + '\n};\n'
          (src / 'korean-level-map.ts').write_text(out)

          vp = src / 'vocabulary.ts'
          vt = vp.read_text()
          if 'export type KoreanGrade' not in vt:
              vt = vt.replace(
                  'export type ExamLevel = "N5" | "N4" | "N3" | "N2" | "N1";\n',
                  'export type ExamLevel = "N5" | "N4" | "N3" | "N2" | "N1";\nexport type KoreanGrade = "초급" | "중급" | "고급";\n'
              )
          if 'koreanGrade?: KoreanGrade;' not in vt:
              vt = vt.replace('  examLevel?: ExamLevel;\n', '  examLevel?: ExamLevel;\n  koreanGrade?: KoreanGrade;\n')
          if 'koreanGradeByWord' not in vt:
              vt = vt.replace(
                  'import { jlptLevelByWord } from "./jlpt-level-map";\n',
                  'import { jlptLevelByWord } from "./jlpt-level-map";\nimport { koreanGradeByWord } from "./korean-level-map";\n'
              )
          if 'function levelFromKoreanGrade' not in vt:
              vt = vt.replace(
                  'function levelFromJlpt(examLevel: ExamLevel): Level {\n  if (examLevel === "N5" || examLevel === "N4") return "Basic";\n  if (examLevel === "N3") return "Intermediate";\n  return "Advanced";\n}\n',
                  'function levelFromJlpt(examLevel: ExamLevel): Level {\n  if (examLevel === "N5" || examLevel === "N4") return "Basic";\n  if (examLevel === "N3") return "Intermediate";\n  return "Advanced";\n}\n\nfunction levelFromKoreanGrade(koreanGrade: KoreanGrade): Level {\n  if (koreanGrade === "초급") return "Basic";\n  if (koreanGrade === "중급") return "Intermediate";\n  return "Advanced";\n}\n'
              )

          old = '''export function normalizeVocabForExam(item: VocabItem): VocabItem {\n  if (item.targetLanguage !== "Japanese") return item;\n  const examLevel = jlptLevelByWord[item.targetText] as ExamLevel | undefined;\n  if (examLevel) {\n    return { ...item, examLevel, level: levelFromJlpt(examLevel), topic: "JLPT" };\n  }\n  if (item.topic === "JLPT") {\n    const { examLevel: _unused, ...rest } = item;\n    return { ...rest, topic: "general" };\n  }\n  return item;\n}'''
          new = '''export function normalizeVocabForExam(item: VocabItem): VocabItem {\n  if (item.targetLanguage === "Japanese") {\n    const examLevel = jlptLevelByWord[item.targetText] as ExamLevel | undefined;\n    if (examLevel) {\n      return { ...item, examLevel, level: levelFromJlpt(examLevel), topic: "JLPT" };\n    }\n    if (item.topic === "JLPT") {\n      const { examLevel: _unused, ...rest } = item;\n      return { ...rest, topic: "general" };\n    }\n    return item;\n  }\n\n  if (item.targetLanguage === "Korean") {\n    const koreanGrade = koreanGradeByWord[item.targetText] as KoreanGrade | undefined;\n    if (koreanGrade) {\n      return { ...item, koreanGrade, level: levelFromKoreanGrade(koreanGrade) };\n    }\n    if (item.topic === "TOPIK") {\n      const { koreanGrade: _unused, ...rest } = item;\n      return { ...rest, topic: "general" };\n    }\n  }\n\n  return item;\n}'''
          if old not in vt:
              raise SystemExit('Could not locate normalizeVocabForExam block')
          vt = vt.replace(old, new)
          vp.write_text(vt)

          mp = src / 'main.tsx'
          mt = mp.read_text()
          replacements = {
              'JLPT N5-N4 / TOPIK 1-2': 'JLPT N5-N4 / Korean 초급 (~TOPIK 1-2)',
              'JLPT N3 / TOPIK 3-4': 'JLPT N3 / Korean 중급 (~TOPIK 3-4)',
              'JLPT N2-N1 / TOPIK 5-6': 'JLPT N2-N1 / Korean 고급 (~TOPIK 5-6)',
          }
          for a, b in replacements.items():
              mt = mt.replace(a, b)
          mp.write_text(mt)

          object_pat = re.compile(r'targetLanguage:\s*"Korean"\s*,\s*targetText:\s*"([^"]+)"')
          current = []
          for p in src.glob('vocabulary*.ts'):
              if p.name == 'vocabulary.ts':
                  continue
              current.extend(object_pat.findall(p.read_text()))
          matched = sum(1 for w in current if w in mapping)
          print('KOREAN_GRADE_MAP_ENTRIES', len(mapping))
          print('OBJECT_KOREAN_WORDS', len(current), 'MATCHED', matched)
          for w in ['학교','신문','제도','촉구하다','현저하다','모호하다','귀결','입증']:
              print('SAMPLE', w, mapping.get(w))
          PY
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/korean-level-map.ts src/vocabulary.ts src/main.tsx
          git commit -m "Recalibrate Korean vocabulary by learner level"
          git pull --rebase origin main
          git push origin HEAD:main
