name: Vocabulary merge dedupe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vocab-merge-dedupe.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch semantic vocabulary dedupe
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/main.tsx')
          text = path.read_text()
          old = 'setVocab((current) => mergeVocabMetadata(takeUnique([...vocabSeed, ...remoteVocab], Number.MAX_SAFE_INTEGER), current));'
          new = 'setVocab((current) => mergeVocabMetadata(takeUniqueVocabulary([...vocabSeed, ...remoteVocab]), current));'
          if old not in text and new not in text:
              raise SystemExit('Expected remote vocabulary merge line not found')
          text = text.replace(old, new, 1)

          anchor = '''function takeUnique(items: VocabItem[], limit: number) {\n  const seen = new Set<string>();\n  const selected: VocabItem[] = [];\n  for (const item of items) {\n    if (seen.has(item.id)) continue;\n    seen.add(item.id);\n    selected.push(item);\n    if (selected.length === limit) break;\n  }\n  return selected;\n}\n'''
          helper = anchor + '''\nfunction takeUniqueVocabulary(items: VocabItem[]) {\n  const seenIds = new Set<string>();\n  const seenWords = new Set<string>();\n  const selected: VocabItem[] = [];\n  for (const item of items) {\n    const wordKey = [\n      item.targetLanguage,\n      item.level,\n      item.topic,\n      item.targetText.normalize("NFKC").trim().toLocaleLowerCase(),\n    ].join(":");\n    if (seenIds.has(item.id) || seenWords.has(wordKey)) continue;\n    seenIds.add(item.id);\n    seenWords.add(wordKey);\n    selected.push(item);\n  }\n  return selected;\n}\n'''
          if 'function takeUniqueVocabulary(items: VocabItem[])' not in text:
              if anchor not in text:
                  raise SystemExit('Expected takeUnique helper not found')
              text = text.replace(anchor, helper, 1)
          path.write_text(text)
          PY
      - name: Verify build
        run: |
          npm ci
          npm run build
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Deduplicate remote vocabulary by word identity"
            git push origin HEAD:main
          fi
