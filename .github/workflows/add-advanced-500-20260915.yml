          帯域|대역|带宽|bandwidth
          速度|속도|速度|speed
          攻撃|공격|攻击|attack
          防御|방어|防御|defense
          侵入|침입|入侵|intrusion
          漏洩|유출|泄露|leakage
          破損|파손|破损|damage
          改ざん|변조|篡改|tampering
          遮断|차단|阻断|blocking
          隔離|격리|隔离|isolation
          予防|예방|预防|prevention
          '''

          selected=[]
          seen_ja=set(); seen_ko=set()
          rejected=[]
          for raw in DATA.splitlines():
              raw=raw.strip()
              if not raw: continue
              ja,ko,zh,en=[x.strip() for x in raw.split('|',3)]
              if not standalone(ja) or not standalone(ko):
                  rejected.append(('phrase',ja,ko)); continue
              if ja in used_ja or ko in used_ko or ja in seen_ja or ko in seen_ko:
                  rejected.append(('duplicate',ja,ko)); continue
              selected.append((ja,ko,zh,en)); seen_ja.add(ja); seen_ko.add(ko)
              if len(selected)==250: break

          if len(selected)!=250:
              print('selected',len(selected),'rejected',len(rejected))
              print('last rejects',rejected[-30:])
              raise SystemExit('Not enough unique Advanced pairs')

          lines=[
            'import type { VocabItem } from "./vocabulary";', '',
            '// 500 new Advanced standalone headwords: 250 Japanese + 250 Korean.',
            '// Generated from curated semantic pairs after global de-duplication.',
            'export const advancedExpansion2: VocabItem[] = ['
          ]
          for i,(ja,ko,zh,en) in enumerate(selected,1):
              rd=reading(ja); rm=romaji(rd)
              lines += [
                '  {', f'    id: {q(f"ja-advanced-exp2-{i:03d}")},',
                '    targetLanguage: "Japanese",', f'    targetText: {q(ja)},',
                f'    meanings: {{ English: {q(en)}, "Simplified Chinese": {q(zh)} }},',
                f'    reading: {q(rd)},', f'    romanization: {q(rm)},',
                '    level: "Advanced",', '    topic: "JLPT",',
                f'    exampleSentence: {q(f"「{ja}」の意味と使い方を確認します。")},',
                '    exampleTranslations: { English: "We review the meaning and usage of this word.", "Simplified Chinese": "我们复习这个词的含义和用法。" },',
                '  },', '  {', f'    id: {q(f"ko-advanced-exp2-{i:03d}")},',
                '    targetLanguage: "Korean",', f'    targetText: {q(ko)},',
                f'    meanings: {{ English: {q(en)}, "Simplified Chinese": {q(zh)} }},',
                f'    reading: {q(ko)},', '    romanization: "",',
                '    level: "Advanced",', '    topic: "TOPIK",',
                f'    exampleSentence: {q(f"“{ko}”의 의미와 쓰임을 확인합니다.")},',
                '    exampleTranslations: { English: "We review the meaning and usage of this word.", "Simplified Chinese": "我们复习这个词的含义和用法。" },',
                '  },'
              ]
          lines.append('];')
          OUT.write_text('\n'.join(lines)+'\n')

          # Final structural audit.
          text=OUT.read_text()
          objs=objpat.findall(text)
          assert len(objs)==500, len(objs)
          assert sum(1 for l,_ in objs if l=='Japanese')==250
          assert sum(1 for l,_ in objs if l=='Korean')==250
          words_ja=[w for l,w in objs if l=='Japanese']; words_ko=[w for l,w in objs if l=='Korean']
          assert len(words_ja)==len(set(words_ja))==250
          assert len(words_ko)==len(set(words_ko))==250
          assert not (set(words_ja)&used_ja)
          assert not (set(words_ko)&used_ko)
          assert all(standalone(w) for _,w in objs)
          assert '相关' not in text and 'related ' not in text

          vp=SRC/'vocabulary.ts'; vt=vp.read_text()
          imp='import { advancedExpansion2 } from "./vocabulary-advanced-expansion-2";\n'
          if imp not in vt:
              marker='import { advancedVocab } from "./vocabulary-advanced";\n'
              vt=vt.replace(marker, marker+imp)
          spread='  ...advancedExpansion2,\n'
          if spread not in vt:
              marker='  ...advancedVocab,\n'
              vt=vt.replace(marker, marker+spread)
          vp.write_text(vt)
          print('ADVANCED_500_OK',len(selected),'pairs /',len(objs),'entries')
          print('rejected duplicates/phrases before selection:',len(rejected))
          print('first:',selected[:5]); print('last:',selected[-5:])
          PY
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit expansion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vocabulary-advanced-expansion-2.ts src/vocabulary.ts
          git commit -m "Add 500 curated Advanced vocabulary entries"
          git push origin HEAD:main
