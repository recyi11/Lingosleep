name: Add Advanced 500
on:
  push:
    paths:
      - '.github/workflows/add-advanced-500-20260915.yml'
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validators
        run: pip install -q sudachipy sudachidict_core pykakasi
      - name: Generate 500 Advanced entries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json
          from sudachipy import dictionary
          from pykakasi import kakasi

          SRC=Path('src')
          OUT=SRC/'vocabulary-advanced-expansion-2.ts'
          tokenizer=dictionary.Dictionary().create()
          kks=kakasi()

          def kata_to_hira(s):
              return ''.join(chr(ord(c)-0x60) if 'ァ' <= c <= 'ヶ' else c for c in s)
          def reading(word):
              return kata_to_hira(''.join(t.reading_form() for t in tokenizer.tokenize(word)))
          def romaji(rd):
              return ''.join(x['hepburn'] for x in kks.convert(rd))
          def q(s): return json.dumps(s, ensure_ascii=False)
          def standalone(s): return bool(s) and not re.search(r'[\s,，、;/|]', s)

          used_ja=set(); used_ko=set()
          objpat=re.compile(r'targetLanguage:\s*"(Japanese|Korean)"\s*,\s*targetText:\s*"([^"]+)"')
          for p in SRC.glob('vocabulary*.ts'):
              if p.name == OUT.name: continue
              text=p.read_text()
              for lang,w in objpat.findall(text):
                  (used_ja if lang=='Japanese' else used_ko).add(w)
              # basic expansion rows: [topic,pos,en,zh,ja,reading,romanization,ko]
              if p.name=='vocabulary-basic-expansion.ts':
                  for line in text.splitlines():
                      s=line.strip().rstrip(',')
                      if s.startswith('['):
                          try: r=json.loads(s)
                          except: continue
                          if len(r)==8:
                              used_ja.add(r[4]); used_ko.add(r[7])
              # noun expansion rows: [topic,en,zh,ja,reading,romanization,ko]
              if p.name=='vocabulary-noun-expansion.ts':
                  for line in text.splitlines():
                      s=line.strip().rstrip(',')
                      if s.startswith('['):
                          try: r=json.loads(s)
                          except: continue
                          if len(r)==7:
                              used_ja.add(r[3]); used_ko.add(r[6])

