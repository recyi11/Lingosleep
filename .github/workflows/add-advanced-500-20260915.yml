          標準化|표준화|标准化|standardization
          正規化|정규화|规范化|normalization
          初期化|초기화|初始化|initialization
          設定|설정|设置|setting
          移植性|이식성|可移植性|portability
          再利用性|재사용성|可复用性|reusability
          競合|경합|竞争冲突|contention
          衝突|충돌|冲突|collision
