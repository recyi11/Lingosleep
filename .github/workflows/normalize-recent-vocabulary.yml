          lines.append('];'); Path('src/vocabulary-validated-expansion.ts').write_text('\n'.join(lines)+'\n')
          print('COUNTS basic',len(fixed),'noun',len(ci),len(ca),'validated',sum(len(v) for v in selected.values())*2)
