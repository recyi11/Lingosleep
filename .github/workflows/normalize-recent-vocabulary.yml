              line=line.strip()
              if not line:continue
              lev,ja,ko,zh,en=[x.strip() for x in line.split('|',4)]
              rd=reading(ja); rm=roman(rd)
              manual.append(dict(level=lev,ja=ja,ko=ko,zh=zh,en=en,rd=rd,rm=rm,jlpt=9,vol=9,order=9))

          selected={'Intermediate':[],'Advanced':[]}; usedj=set(existing['Japanese']); usedk=set(existing['Korean'])
          def accept(x):
              if x['ja'] in usedj or x['ko'] in usedk:return False
              if re.search(r'[\s,，、;/]',x['ja']) or re.search(r'[\s,，、;/]',x['ko']):return False
              if not re.fullmatch(r'[가-힣]{2,8}',x['ko']):return False
              usedj.add(x['ja']);usedk.add(x['ko']);selected[x['level']].append(x);return True
          for lev,target in [('Intermediate',100),('Advanced',150)]:
              pool=sorted([x for x in auto if x['level']==lev],key=lambda x:(x['jlpt'],x['vol'],x['order']))+[x for x in manual if x['level']==lev]
              for x in pool:
                  if len(selected[lev])>=target:break
                  accept(x)
              if len(selected[lev])!=target:raise SystemExit(f'Validated refill failed {lev}: {len(selected[lev])}')

          lines=['import type { VocabItem } from "./vocabulary";','','// 500 standalone headwords: 200 Intermediate + 300 Advanced.','// Targets are globally de-duplicated against every earlier vocabulary batch.','export const validatedHeadwordExpansion: VocabItem[] = [']
