          for lev in ('Intermediate','Advanced'):
              for x in selected[lev]:
                  counters[lev]+=1;n=counters[lev];jp,kp=pats[(n-1)%4]
                  for lc in ('ja','ko'):
                      if lc=='ja': lang='Japanese';target=x['ja'];rd=x['rd'];rm=x['rm'];topic='JLPT';ex=jp.format(w=target)
                      else: lang='Korean';target=x['ko'];rd=target;rm='';topic='TOPIK';ex=kp.format(w=target)
                      ident=f'{lc}-validated-{lev.lower()}-{n:03d}'
