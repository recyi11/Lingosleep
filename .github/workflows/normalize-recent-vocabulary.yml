      - name: Strict final audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          seen={'Japanese':{},'Korean':{}}; errors=[]; counts={}
          # direct object files excluding tuple expansions and aggregator
          for p in Path('src').glob('vocabulary*.ts'):
              if p.name in {'vocabulary.ts','vocabulary-basic-expansion.ts','vocabulary-noun-expansion.ts'}:continue
              t=p.read_text()
              for b in re.findall(r'\{\s*id:\s*"([^"]+)"[\s\S]*?\n?\s*\},?',t):
                  lm=re.search(r'targetLanguage:\s*"(Japanese|Korean)"',b);tm=re.search(r'targetText:\s*"([^"]+)"',b)
                  if not(lm and tm):continue
                  lang,w=lm.group(1),tm.group(1);key=(lang,w)
                  if w in seen[lang]:errors.append(('duplicate',key,seen[lang][w],str(p)))
                  else:seen[lang][w]=str(p)
                  if p.name=='vocabulary-validated-expansion.ts' and re.search(r'[\s,，、;/]',w):errors.append(('validated-phrase',key))
          # tuple files
          for fn,fields,jaidx,koidx in [('vocabulary-basic-expansion.ts',8,4,7),('vocabulary-noun-expansion.ts',7,3,6)]:
              p=Path('src')/fn
              for ln,line in enumerate(p.read_text().splitlines(),1):
                  vals=re.findall(r'"((?:[^"\\]|\\.)*)"',line.strip())
                  if len(vals)<fields:continue
                  for lang,idx in [('Japanese',jaidx),('Korean',koidx)]:
                      w=vals[idx]
                      if w in seen[lang]:errors.append(('duplicate',(lang,w),seen[lang][w],f'{fn}:{ln}'))
                      else:seen[lang][w]=f'{fn}:{ln}'
                      if re.search(r'[\s,，、;/]',w):errors.append(('tuple-phrase',(lang,w),fn,ln))
          vt=Path('src/vocabulary-validated-expansion.ts').read_text()
          if len(re.findall(r'id:\s*"(?:ja|ko)-validated-',vt))!=500:errors.append(('bad-validated-count',))
          if '，相关' in vt or ', related ' in vt:errors.append(('fake-related',))
          bt=Path('src/vocabulary-basic-expansion.ts').read_text(); nt=Path('src/vocabulary-noun-expansion.ts').read_text()
          if '"瓶", "かめ"' in bt:errors.append(('bad-bottle-reading',))
          if '"반 친구"' in bt:errors.append(('basic-phrase-remains',))
          if errors:
              print('\n'.join(map(str,errors[:100])));raise SystemExit(f'Audit failed with {len(errors)} errors')
          print('STRICT_AUDIT_OK unique Japanese',len(seen['Japanese']),'Korean',len(seen['Korean']))
          PY
