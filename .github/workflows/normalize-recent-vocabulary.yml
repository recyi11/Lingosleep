name: Normalize recent vocabulary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-recent-vocabulary.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: git pull --ff-only origin main
      - name: Install validators
        run: pip install -q sudachipy sudachidict_core pykakasi
      - name: Normalize Basic and noun expansions and regenerate validated 500
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, io, json, re, urllib.request
          from sudachipy import dictionary
          from pykakasi import kakasi

          tok=dictionary.Dictionary().create(); kks=kakasi()
          def hira(s): return ''.join(chr(ord(c)-0x60) if 'ァ'<=c<='ヶ' else c for c in s)
          def reading(w): return hira(''.join(x.reading_form() for x in tok.tokenize(w)))
          def roman(h): return ''.join(x['hepburn'] for x in kks.convert(h))
          def q(s): return json.dumps(s,ensure_ascii=False)

          # ---------- parsers ----------
          def direct_words(exclude=()):
              out={'Japanese':set(),'Korean':set()}
              for p in Path('src').glob('vocabulary*.ts'):
                  if p.name in exclude or p.name=='vocabulary.ts': continue
                  t=p.read_text()
                  # handles both one-line and multiline objects
                  for b in re.findall(r'\{\s*id:\s*"[^"]+"[\s\S]*?\n?\s*\},?',t):
                      lm=re.search(r'targetLanguage:\s*"(Japanese|Korean)"',b); tm=re.search(r'targetText:\s*"([^"]+)"',b)
                      if lm and tm: out[lm.group(1)].add(tm.group(1))
              return out

          def parse_tuple_rows(path, fields):
              rows=[]
              for line in Path(path).read_text().splitlines():
                  s=line.strip()
                  if not s.startswith('['): continue
                  vals=re.findall(r'"((?:[^"\\]|\\.)*)"',s)
                  if len(vals)>=fields: rows.append(vals[:fields])
              return rows

          # ---------- Basic: remove old-word collisions, correct known bad data, refill with reviewed basics ----------
          base_existing=direct_words(exclude={'vocabulary-basic-expansion.ts','vocabulary-noun-expansion.ts','vocabulary-validated-expansion.ts'})
          basic_path=Path('src/vocabulary-basic-expansion.ts'); basic_text=basic_path.read_text()
          basic_rows=parse_tuple_rows(basic_path,8)
          fixed=[]; seenja=set(base_existing['Japanese']); seenko=set(base_existing['Korean'])
          for r in basic_rows:
              topic,pos,en,zh,ja,jr,jrom,ko=r
              # factual/lexical corrections
              if ja=='袋' and ko=='봉투': en,zh,ja,jr,jrom='envelope','信封','封筒','ふうとう','fuutou'
              if ja=='瓶' and en=='bottle': jr,jrom='びん','bin'
              if ja=='バス停': en,zh,ja,jr,jrom,ko='stop','车站/停靠站','停留所','ていりゅうじょ','teiryuujo','정류장'
              if ja=='同級生' and ko=='반 친구': ko='동급생'
              if ja in seenja or ko in seenko: continue
              if re.search(r'[\s,，、;/]',ja) or re.search(r'[\s,，、;/]',ko): continue
              seenja.add(ja); seenko.add(ko); fixed.append([topic,pos,en,zh,ja,jr,jrom,ko])

          BASIC_RESERVE='''
          food|noun|bowl|碗|茶碗|ちゃわん|chawan|그릇
          food|noun|plate|盘子|皿|さら|sara|접시
          food|noun|chopsticks|筷子|箸|はし|hashi|젓가락
          food|noun|spoon|勺子|スプーン|すぷーん|supuun|숟가락
          food|noun|fork|叉子|フォーク|ふぉーく|fooku|포크
          food|noun|knife|刀|ナイフ|ないふ|naifu|칼
          food|noun|cup|杯子|コップ|こっぷ|koppu|컵
          food|noun|pot|锅|鍋|なべ|nabe|냄비
          food|noun|frying pan|平底锅|フライパン|ふらいぱん|furaipan|프라이팬
          food|noun|refrigerator|冰箱|冷蔵庫|れいぞうこ|reizouko|냉장고
          food|noun|freezer|冷冻柜|冷凍庫|れいとうこ|reitouko|냉동고
          travel|noun|crosswalk|人行横道|横断歩道|おうだんほどう|oudanhodou|횡단보도
          travel|noun|parking lot|停车场|駐車場|ちゅうしゃじょう|chuushajou|주차장
          travel|noun|traffic jam|堵车|渋滞|じゅうたい|juutai|정체
          travel|noun|police box|派出所|交番|こうばん|kouban|파출소
          travel|noun|tollgate|收费站|料金所|りょうきんじょ|ryoukinjo|요금소
          travel|noun|ferry|渡轮|フェリー|ふぇりー|ferii|페리
          travel|noun|platform|站台|ホーム|ほーむ|hoomu|승강장
          travel|noun|passenger|乘客|乗客|じょうきゃく|joukyaku|승객
          travel|noun|ship|船|船|ふね|fune|선박
          travel|noun|intersection|路口|十字路|じゅうじろ|juujiro|사거리
          daily life|noun|soap|肥皂|石鹸|せっけん|sekken|비누
          daily life|noun|toothbrush|牙刷|歯ブラシ|はぶらし|haburashi|칫솔
          daily life|noun|bathroom|浴室|浴室|よくしつ|yokushitsu|욕실
          daily life|noun|vacuum cleaner|吸尘器|掃除機|そうじき|soujiki|청소기
          daily life|noun|microwave|微波炉|電子レンジ|でんしれんじ|denshirenji|전자레인지
          daily life|noun|washing machine|洗衣机|洗濯機|せんたくき|sentakuki|세탁기
          daily life|noun|fever|发烧|発熱|はつねつ|hatsunetsu|발열
          daily life|noun|medicine cabinet|药箱|薬箱|くすりばこ|kusuribako|약상자
          work|noun|desk|办公桌|机|つくえ|tsukue|책상
          work|noun|chair|椅子|椅子|いす|isu|의자
          work|noun|stamp|印章|印鑑|いんかん|inkan|도장
          work|noun|warehouse|仓库|倉庫|そうこ|souko|창고
          work|noun|store|店铺|店舗|てんぽ|tenpo|매장
          work|noun|factory|工厂|工場|こうじょう|koujou|공장
          work|noun|president|社长|社長|しゃちょう|shachou|사장
          work|noun|manager|科长|課長|かちょう|kachou|과장
          work|noun|coworker|同事|同僚|どうりょう|douryou|동료
          work|noun|boss|上司|上司|じょうし|joushi|상사
          work|noun|company worker|公司职员|会社員|かいしゃいん|kaishain|회사원
          work|noun|invoice|账单|請求書|せいきゅうしょ|seikyuusho|청구서
          school|noun|blackboard|黑板|黒板|こくばん|kokuban|칠판
          school|noun|semester|学期|学期|がっき|gakki|학기
          school|noun|subject|科目|科目|かもく|kamoku|과목
          school|noun|school gate|校门|校門|こうもん|koumon|교문
          school|noun|pencil case|铅笔盒|筆箱|ふでばこ|fudebako|필통
          school|noun|principal|校长|校長|こうちょう|kouchou|교장
          school|noun|professor|教授|教授|きょうじゅ|kyouju|교수
          school|noun|lecturer|讲师|講師|こうし|koushi|강사
          school|noun|answer sheet|答卷|答案|とうあん|touan|답안
          school|noun|grading|评分|採点|さいてん|saiten|채점
          school|noun|credit|学分|単位|たんい|tan'i|학점
          school|noun|locker|储物柜|ロッカー|ろっかー|rokkaa|사물함
          school|noun|school building|校舍|校舎|こうしゃ|kousha|교사
          anime/drama|noun|stage|舞台|舞台|ぶたい|butai|무대
          anime/drama|noun|acting|演技|演技|えんぎ|engi|연기
          anime/drama|noun|preview|预告|予告|よこく|yokoku|예고
          anime/drama|noun|broadcast|播出|放送|ほうそう|housou|방송
          anime/drama|noun|audience|观众|観客|かんきゃく|kankyaku|관객
          anime/drama|noun|cinema|电影院|映画館|えいがかん|eigakan|영화관
          anime/drama|noun|performance|表演|上演|じょうえん|jouen|공연
          anime/drama|noun|screen|银幕|スクリーン|すくりーん|sukuriin|스크린
          '''
          for line in BASIC_RESERVE.splitlines():
              if len(fixed)>=250: break
              line=line.strip()
              if not line: continue
              topic,pos,en,zh,ja,jr,jrom,ko=[x.strip() for x in line.split('|')]
              if ja in seenja or ko in seenko or re.search(r'\s',ko): continue
              seenja.add(ja); seenko.add(ko); fixed.append([topic,pos,en,zh,ja,jr,jrom,ko])
          if len(fixed)!=250: raise SystemExit(f'Basic refill failed: {len(fixed)}')

          # Rebuild only the row array, preserving generator below it.
          start=basic_text.index('const rows: BasicRow[] = ['); arr_start=basic_text.index('[',start); arr_end=basic_text.index('];',arr_start)
          row_lines=[]
          for r in fixed:
              row_lines.append('  ['+', '.join(q(x) for x in r)+'],')
          basic_text=basic_text[:arr_start+1]+'\n'+'\n'.join(row_lines)+'\n'+basic_text[arr_end:]
          basic_path.write_text(basic_text)

          # ---------- Noun expansion: remove collisions with old+clean Basic; correct hidden phrase-like Korean forms; refill ----------
          old=direct_words(exclude={'vocabulary-basic-expansion.ts','vocabulary-noun-expansion.ts','vocabulary-validated-expansion.ts'})
          for r in fixed:
              old['Japanese'].add(r[4]); old['Korean'].add(r[7])
          noun_path=Path('src/vocabulary-noun-expansion.ts'); nt=noun_path.read_text()
          def section(name,next_name=None):
              s=nt.index(f'const {name}: NounPair[] = ['); a=nt.index('[',s)
              e=nt.index('];',a)
              vals=[]
              for line in nt[a+1:e].splitlines():
                  x=re.findall(r'"((?:[^"\\]|\\.)*)"',line.strip())
                  if len(x)>=7: vals.append(x[:7])
              return s,a,e,vals
          si,ai,ei,inter=section('intermediateNouns'); sa,aa,ea,adv=section('advancedNouns')
          orig_counts=(len(inter),len(adv))

          def normalize_noun(r):
              topic,en,zh,ja,jr,jrom,ko=r
              replacements={
                '수하물카트': ('cart','手推车','カート','かーと','kaato','카트'),
                '학생식당': ('campus cafeteria','学生食堂','学食','がくしょく','gakushoku','학식'),
                '배경설정': ('setting','设定','設定','せってい','settei','설정'),
                '회복탄력성': ('resilience','恢复力','回復力','かいふくりょく','kaifukuryoku','회복력'),
                '보존기간': ('retention','保留','保持','ほじ','hoji','보존'),
                '자격증명': ('authority','权限','権限','けんげん','kengen','권한'),
                '인구동태': ('demography','人口学','人口学','じんこうがく','jinkougaku','인구학'),
                '동료평가': ('reviewer','评审人','査読者','さどくしゃ','sadokusha','심사자'),
              }
              if ko in replacements:
                  en,zh,ja,jr,jrom,ko=replacements[ko]
              return [topic,en,zh,ja,jr,jrom,ko]

          seenja=set(old['Japanese']); seenko=set(old['Korean'])
          def clean_rows(rows):
              out=[]
              for rr in rows:
                  r=normalize_noun(rr); topic,en,zh,ja,jr,jrom,ko=r
                  if ja in seenja or ko in seenko: continue
                  if re.search(r'[\s,，、;/]',ja) or re.search(r'[\s,，、;/]',ko): continue
                  seenja.add(ja); seenko.add(ko); out.append(r)
              return out
          ci=clean_rows(inter); ca=clean_rows(adv)

          NOUN_INTER_RESERVE='''
          work|minutes|会议记录|議事録|ぎじろく|gijiroku|회의록
          work|billing|请款|請求|せいきゅう|seikyuu|청구
          work|delivery date|交货期|納期|のうき|nouki|납기
          work|operation|运行|稼働|かどう|kadou|가동
          work|manual|手册|手引|てびき|tebiki|지침서
          work|branch|分支|支社|ししゃ|shisha|지사
          work|dispatch|派遣|派遣|はけん|haken|파견
          work|assignment|担当|担当|たんとう|tantou|담당
          travel|gate|登机口|搭乗口|とうじょうぐち|toujouguchi|탑승구
          travel|navigation|导航|案内|あんない|annai|길안내
          travel|tourist|游客|観光客|かんこうきゃく|kankoukyaku|관광객
          travel|check-in|值机|搭乗手続|とうじょうてつづき|toujoutetsuzuki|체크인
          travel|delay|延误|遅延|ちえん|chien|지연
          travel|cancellation|取消|欠航|けっこう|kekkou|결항
          daily life|renewal|更新|更新|こうしん|koushin|갱신
          daily life|cancellation|解约|解約|かいやく|kaiyaku|해지
          daily life|lease|租约|賃貸|ちんたい|chintai|임대
          daily life|tenant|租户|入居者|にゅうきょしゃ|nyuukyosya|세입자
          school|completion|修读|履修|りしゅう|rishuu|이수
          school|major|专业|専攻|せんこう|senkou|전공
          school|curriculum|课程体系|課程|かてい|katei|교육과정
          school|enrollment|入学|入学|にゅうがく|nyuugaku|입학
          school|scholarship|奖学金|奨学金|しょうがくきん|shougakukin|장학금
          school|thesis|学位论文|学位論文|がくいろんぶん|gakuirombun|학위논문
          anime/drama|streaming|流媒体|配信|はいしん|haishin|스트리밍
          anime/drama|performance|表演|演技|えんぎ|engi|연기력
          anime/drama|screening|放映|上映|じょうえい|jouei|상영
          anime/drama|episode count|集数|話数|わすう|wasuu|회차
          anime/drama|viewer|观众|視聴者|しちょうしゃ|shichousha|시청자
          anime/drama|broadcast|播出|放映|ほうえい|houei|방영
          '''
          NOUN_ADV_RESERVE='''
          work|audit|审计|監査|かんさ|kansa|감사
          work|authorization|授权|認可|にんか|ninka|인가
          work|privilege|权限|特権|とっけん|tokken|특권
          work|governance body|理事会|理事会|りじかい|rijikai|이사회
          work|continuity|连续性|継続性|けいぞくせい|keizokusei|지속성
          work|optimization|优化|最適化|さいてきか|saitekika|최적화
          work|automation|自动化|自動化|じどうか|jidouka|자동화
          work|orchestration|编排|編成|へんせい|hensei|오케스트레이션
          travel|embarkation|登乘|乗船|じょうせん|jousen|승선
          travel|disembarkation|下船|下船|げせん|gesen|하선
          travel|border|边境|国境|こっきょう|kokkyou|국경
          travel|visa waiver|免签|免査証|めんさしょう|mensashou|무비자
          travel|repatriation|遣返|送還|そうかん|soukan|송환
          travel|detention|拘留|拘留|こうりゅう|kouryuu|구류
          daily life|eligibility|资格|適格性|てきかくせい|tekikakusei|적격성
          daily life|entitlement|权益|受給権|じゅきゅうけん|jukyuuken|수급권
          daily life|household finance|家计|家計|かけい|kakei|가계
          daily life|consumption|消费|消費|しょうひ|shouhi|소비
          school|epistemology|认识论|認識論|にんしきろん|ninshikiron|인식론
          school|ontology|本体论|存在論|そんざいろん|sonzairon|존재론
          school|discourse|话语|言説|げんせつ|gensetsu|담론
          school|paradigm|范式|範型|はんけい|hankei|패러다임
          school|verification|验证|検証|けんしょう|kenshou|검증
          school|generalization|泛化|一般化|いっぱんか|ippanka|일반화
          anime/drama|aesthetics|美学|美学|びがく|bigaku|미학
          anime/drama|interpretation|解读|解釈|かいしゃく|kaishaku|해석
          anime/drama|reception|接受|受容|じゅよう|juyou|수용
          anime/drama|representation|表象|表象|ひょうしょう|hyoushou|표상
          anime/drama|satire|讽刺|風刺|ふうし|fuushi|풍자
          anime/drama|allegory|寓意|寓意|ぐうい|guui|우의
          '''
          def fill(rows,target,reserve):
              for line in reserve.splitlines():
                  if len(rows)>=target: break
                  line=line.strip()
                  if not line: continue
                  topic,en,zh,ja,jr,jrom,ko=[x.strip() for x in line.split('|')]
                  if ja in seenja or ko in seenko or re.search(r'\s',ko): continue
                  seenja.add(ja); seenko.add(ko); rows.append([topic,en,zh,ja,jr,jrom,ko])
              if len(rows)!=target: raise SystemExit(f'Noun refill failed {len(rows)}/{target}')
          fill(ci,orig_counts[0],NOUN_INTER_RESERVE); fill(ca,orig_counts[1],NOUN_ADV_RESERVE)

          def rows_text(rows): return '\n'.join('  ['+', '.join(q(x) for x in r)+'],' for r in rows)
          # rebuild from end section first so offsets don't shift
          nt=nt[:aa+1]+'\n'+rows_text(ca)+'\n'+nt[ea:]
          # recompute intermediate markers in changed text
          s=nt.index('const intermediateNouns: NounPair[] = ['); a=nt.index('[',s); e=nt.index('];',a)
          nt=nt[:a+1]+'\n'+rows_text(ci)+'\n'+nt[e:]
          noun_path.write_text(nt)

          # ---------- Regenerate second 500 against ALL current vocabulary ----------
          existing=direct_words(exclude={'vocabulary-validated-expansion.ts'})
          for r in fixed: existing['Japanese'].add(r[4]); existing['Korean'].add(r[7])
          for r in ci+ca: existing['Japanese'].add(r[3]); existing['Korean'].add(r[6])

          JLPT='https://raw.githubusercontent.com/Bluskyo/JLPT_Vocabulary/main/data/vocab/results/JLPT_vocab_ALL.csv'
          YONSEI=[f'https://raw.githubusercontent.com/Amulopapa67/open-yonsei-korean-vocabulary/main/data/csv/vol-0{i}.csv' for i in range(2,7)]
          def get(url):
              with urllib.request.urlopen(url,timeout=60) as r:return r.read().decode('utf-8-sig')
          jlpt={}
          for row in csv.DictReader(io.StringIO(get(JLPT))):
              k=row['Kanji'].strip(); lv=row['Level'].strip()
              if lv in {'1','2','3'} and re.fullmatch(r'[一-龯々ヶ]+',k): jlpt.setdefault(k,[]).append(int(lv))
          auto=[]; sj=set(); sk=set(); blacklist={'自殺','境遇','課外','直後','就業','年間'}
          for url in YONSEI:
              for r in csv.DictReader(io.StringIO(get(url))):
                  ko=r['korean'].strip(); ja=r['origin_detail'].strip()
                  if r['entry_kind']!='lexeme' or r['pos']!='명사' or r['review_status']!='high' or r['origin_type']!='hanja':continue
                  try: conf=float(r['match_confidence'] or 0)
                  except: conf=0
                  if conf<.90 or not re.fullmatch(r'[一-龯々ヶ]{2,6}',ja) or not re.fullmatch(r'[가-힣]{2,8}',ko):continue
                  if ja in blacklist or ja not in jlpt or ja in existing['Japanese'] or ko in existing['Korean'] or ja in sj or ko in sk:continue
                  jl=min(jlpt[ja]); level='Advanced' if jl in (1,2) else 'Intermediate'; vol=int(r['volume'])
                  if level=='Advanced' and vol<3:continue
                  rd=reading(ja); rm=roman(rd)
                  if not rd or not rm or re.search(r'[一-龯]',rd):continue
                  sj.add(ja);sk.add(ko);auto.append(dict(level=level,jlpt=jl,vol=vol,order=int(r['source_order']),ja=ja,ko=ko,zh=re.sub(r'\s+','，',r['chinese'].strip()),en=re.sub(r'\s+',' ',r['english'].strip()),rd=rd,rm=rm))

          MANUAL='''
          Intermediate|医療|의료|医疗|healthcare
          Intermediate|経済|경제|经济|economy
          Intermediate|社会|사회|社会|society
