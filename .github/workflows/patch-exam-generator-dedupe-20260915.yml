name: Patch exam generator dedupe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-exam-generator-dedupe-20260915.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Deduplicate Japanese candidate pools before selection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/build-exam-vocab-expansion.py')
          s = p.read_text()
          old = '''        pool: list[dict] = []\n        for row in rows:\n'''
          new = '''        pool: list[dict] = []\n        pool_seen: set[str] = set()\n        for row in rows:\n'''
          if old not in s:
              raise SystemExit('candidate pool anchor not found')
          s = s.replace(old, new, 1)
          old2 = '''            if not valid_headword(word) or word in used or jlpt_map.get(word) != target_level:\n                continue\n'''
          new2 = '''            if not valid_headword(word) or word in used or word in pool_seen or jlpt_map.get(word) != target_level:\n                continue\n'''
          if old2 not in s:
              raise SystemExit('candidate filter anchor not found')
          s = s.replace(old2, new2, 1)
          old3 = '''            pool.append({\n                "word": word,\n'''
          new3 = '''            pool_seen.add(word)\n            pool.append({\n                "word": word,\n'''
          if old3 not in s:
              raise SystemExit('candidate append anchor not found')
          s = s.replace(old3, new3, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-exam-vocab-expansion.py
          git commit -m "Deduplicate Japanese exam vocabulary candidates"
          git pull --rebase origin main
          git push origin HEAD:main
