name: Validate noun expansion

on:
  push:
    paths:
      - '.github/workflows/validate-noun-expansion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Replace duplicate concepts
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/vocabulary-noun-expansion.ts')
          text = path.read_text()
          replacements = {
            '["work", "minutes", "会议记录", "議事録", "회의록"]': '["work", "office supplies", "办公用品", "備品", "비품"]',
            '["work", "handover", "工作交接", "引継ぎ", "인수인계"]': '["work", "internal approval", "内部审批", "稟議", "품의"]',
            '["travel", "boarding gate", "登机口", "搭乗口", "탑승구"]': '["travel", "boarding order", "登机顺序", "搭乗順", "탑승순서"]',
            '["travel", "immigration", "入境审查", "入国審査", "입국심사"]': '["travel", "immigration control", "出入境", "出入国", "출입국"]',
            '["travel", "delay", "延误", "遅延", "지연"]': '["travel", "seat map", "座位图", "座席表", "좌석표"]',
            '["travel", "cancellation", "航班取消", "欠航", "결항"]': '["travel", "arrival hall", "到达大厅", "到着ロビー", "도착로비"]',
            '["travel", "connection", "转机", "乗継ぎ", "환승"]': '["travel", "transfer station", "换乘站", "乗換駅", "환승역"]',
            '["daily life", "rent", "房租", "家賃", "월세"]': '["daily life", "maintenance fee", "管理费", "管理費", "관리비"]',
            '["daily life", "utility bill", "水电煤账单", "光熱費", "공과금"]': '["daily life", "electricity bill", "电费", "電気料金", "전기요금"]',
            '["daily life", "neighborhood", "社区/附近", "近所", "동네"]': '["daily life", "residents association", "居民会", "自治会", "주민회"]',
            '["school", "tuition", "学费", "授業料", "등록금"]': '["school", "student status", "学籍", "学籍", "학적"]',
            '["school", "semester", "学期", "学期", "학기"]': '["school", "timetable", "课程表", "時間割", "시간표"]',
            '["school", "workshop", "工作坊", "演習", "워크숍"]': '["school", "teaching material", "教材", "教材", "교재"]',
            '["anime/drama", "screenplay", "剧本", "脚本", "각본"]': '["anime/drama", "storyboard", "分镜", "絵コンテ", "스토리보드"]',
            '["anime/drama", "animation", "作画", "作画", "작화"]': '["anime/drama", "key animation", "原画", "原画", "원화"]',
            '["anime/drama", "spoiler", "剧透", "ネタバレ", "스포일러"]': '["anime/drama", "bonus feature", "特典", "特典", "특전"]',
            '["work", "audit", "审计", "監査", "감사"]': '["work", "control", "管控", "統制", "통제"]',
            '["work", "authorization", "授权/权限", "権限", "권한"]': '["work", "approval", "认可/批准", "認可", "인가"]',
            '["school", "hypothesis", "假设", "仮説", "가설"]': '["school", "proposition", "命题", "命題", "명제"]',
            '["school", "causality", "因果关系", "因果関係", "인과관계"]': '["school", "confounding", "混杂因素", "交絡", "교란"]',
          }
          for old, new in replacements.items():
            assert old in text, f'missing expected row: {old}'
            text = text.replace(old, new, 1)
          path.write_text(text)
      - name: Validate noun expansion
        shell: python
        run: |
          import re
          from pathlib import Path

          noun_text = Path('src/vocabulary-noun-expansion.ts').read_text()
          inter = noun_text.split('const intermediateNouns: NounPair[] = [', 1)[1].split('];', 1)[0]
          adv = noun_text.split('const advancedNouns: NounPair[] = [', 1)[1].split('];', 1)[0]
          row_re = re.compile(r'^\s*\["([^"]+)",\s*"([^"]+)",\s*"([^"]+)",\s*"([^"]+)",\s*"([^"]+)"\],\s*$', re.M)
          inter_rows = row_re.findall(inter)
          adv_rows = row_re.findall(adv)
          assert len(inter_rows) == 125, f'Intermediate concept count: {len(inter_rows)}'
          assert len(adv_rows) == 125, f'Advanced concept count: {len(adv_rows)}'

          existing = {'Intermediate': {'Japanese': set(), 'Korean': set()}, 'Advanced': {'Japanese': set(), 'Korean': set()}}
          object_re = re.compile(r'targetLanguage:\s*"(Japanese|Korean)".*?targetText:\s*"([^"]+)".*?level:\s*"(Intermediate|Advanced)"', re.S)
          for name in ['src/vocabulary-intermediate.ts', 'src/vocabulary-advanced.ts', 'src/vocabulary-expansion.ts']:
            text = Path(name).read_text()
            for lang, word, level in object_re.findall(text):
              existing[level][lang].add(word)

          dupes = []
          for level, rows in [('Intermediate', inter_rows), ('Advanced', adv_rows)]:
            own_ja = set()
            own_ko = set()
            for _, _, _, ja, ko in rows:
              if ja in existing[level]['Japanese']:
                dupes.append(f'{level} Japanese existing: {ja}')
              if ko in existing[level]['Korean']:
                dupes.append(f'{level} Korean existing: {ko}')
              if ja in own_ja:
                dupes.append(f'{level} Japanese internal: {ja}')
              if ko in own_ko:
                dupes.append(f'{level} Korean internal: {ko}')
              own_ja.add(ja)
              own_ko.add(ko)
          if dupes:
            print('DUPLICATES:')
            print('\n'.join(dupes))
            raise SystemExit(2)
          print('Validated 250 noun concepts / 500 entries with no duplicate target text.')
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit noun fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/vocabulary-noun-expansion.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Refine 500-word expansion toward unique nouns'
          git push origin HEAD:main
