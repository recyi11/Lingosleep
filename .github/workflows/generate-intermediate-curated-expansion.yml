name: Generate curated Intermediate vocabulary

on:
  push:
    paths:
      - '.github/workflows/generate-intermediate-curated-expansion.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Japanese reading converter
        run: pip install pykakasi
      - name: Patch generator
        run: python scripts/patch_intermediate_generator.py
      - name: Generate curated Intermediate expansion
        run: python scripts/generate_intermediate_curated_expansion.py
      - name: Validate generated file
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('src/vocabulary-intermediate-curated-expansion.ts').read_text()
          rows = re.findall(r'^\s*\["([^"]+)", "(noun|verb|adj)", "([^"]*)", "([^"]*)", "([^"]+)", "([^"]+)", "([^"]+)", "([^"]+)"\],$', text, re.M)
          assert len(rows) == 250, f'Expected 250 concepts, got {len(rows)}'
          ja = [r[4] for r in rows]
          ko = [r[7] for r in rows]
          assert len(set(ja)) == 250, 'Duplicate Japanese headwords in new expansion'
          assert len(set(ko)) == 250, 'Duplicate Korean headwords in new expansion'
          assert all(r[5].strip() for r in rows), 'Blank Japanese reading'
          assert all(r[6].strip() for r in rows), 'Blank Japanese romanization'
          assert all(not re.search(r'\s', x) for x in ja), 'Japanese phrase-like target found'
          assert all(not re.search(r'\s', x) for x in ko), 'Korean phrase-like target found'
          print('Validated 250 standalone concepts / 500 Intermediate entries.')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build generated vocabulary
        run: npm run build
      - name: Commit generated vocabulary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vocabulary-intermediate-curated-expansion.ts
          git diff --cached --quiet && exit 0
          git commit -m "Expand Intermediate vocabulary with 500 curated entries"
          git restore scripts/generate_intermediate_curated_expansion.py
          git pull --rebase origin main
          git push origin main
