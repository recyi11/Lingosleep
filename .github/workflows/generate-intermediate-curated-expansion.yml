name: Generate curated Intermediate vocabulary

on:
  push:
    paths:
      - '.github/workflows/generate-intermediate-curated-expansion.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Japanese reading converter
        run: pip install pykakasi
      - name: Patch one-shot generator
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/generate_intermediate_curated_expansion.py')
          text = path.read_text()
          old_parse = "for line in RAW.strip().splitlines():\n    parts = [p.strip() for p in line.split('|')]"
          new_parse = "for line in RAW.strip().splitlines():\n    if not line.strip():\n        continue\n    parts = [p.strip() for p in line.split('|')]"
          assert old_parse in text, 'Generator parsing block changed unexpectedly'
          text = text.replace(old_parse, new_parse, 1)

          old_select = '''selected = []
seen_ja = set()
seen_ko = set()
for topic, quota in QUOTAS.items():
    accepted = []
    for row in by_topic[topic]:
        _, pos, en, zh, ja, ko = row
        if ja in existing['Japanese'] or ko in existing['Korean']:
            continue
        if ja in seen_ja or ko in seen_ko:
            continue
        accepted.append(row)
        seen_ja.add(ja)
        seen_ko.add(ko)
        if len(accepted) == quota:
            break
    if len(accepted) != quota:
        raise SystemExit(f'{topic}: only {len(accepted)} fresh concepts available, need {quota}')
    selected.extend(accepted)

assert len(selected) == 250'''
          new_select = '''selected = []
seen_ja = set()
seen_ko = set()

def is_fresh(row):
    _, _, _, _, ja, ko = row
    return (
        ja not in existing['Japanese']
        and ko not in existing['Korean']
        and ja not in seen_ja
        and ko not in seen_ko
    )

# First preserve the intended topic balance as far as genuinely fresh vocabulary allows.
for topic, quota in QUOTAS.items():
    accepted = []
    for row in by_topic[topic]:
        if not is_fresh(row):
            continue
        accepted.append(row)
        seen_ja.add(row[4])
        seen_ko.add(row[5])
        if len(accepted) == quota:
            break
    selected.extend(accepted)
    print(f'{topic}: selected {len(accepted)} / target {quota}')

# Fill any shortfall with other fresh curated headwords instead of forcing low-quality filler.
if len(selected) < 250:
    for row in candidates:
        if len(selected) == 250:
            break
        if not is_fresh(row):
            continue
        selected.append(row)
        seen_ja.add(row[4])
        seen_ko.add(row[5])

if len(selected) != 250:
    raise SystemExit(f'Only {len(selected)} globally fresh curated concepts available; need 250')'''
          assert old_select in text, 'Generator selection block changed unexpectedly'
          text = text.replace(old_select, new_select, 1)
          path.write_text(text)
          PY
      - name: Generate curated Intermediate expansion
        run: python scripts/generate_intermediate_curated_expansion.py
      - name: Validate generated file
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('src/vocabulary-intermediate-curated-expansion.ts').read_text()
          rows = re.findall(r'^\s*\["([^"]+)", "(noun|verb|adj)", "([^"]*)", "([^"]*)", "([^"]+)", "([^"]+)", "([^"]+)", "([^"]+)"\],$', text, re.M)
          assert len(rows) == 250, f'Expected 250 concepts, got {len(rows)}'
          ja = [r[4] for r in rows]
          ko = [r[7] for r in rows]
          assert len(set(ja)) == 250, 'Duplicate Japanese headwords in new expansion'
          assert len(set(ko)) == 250, 'Duplicate Korean headwords in new expansion'
          assert all(r[5].strip() for r in rows), 'Blank Japanese reading'
          assert all(r[6].strip() for r in rows), 'Blank Japanese romanization'
          assert all(not re.search(r'\s', x) for x in ja), 'Japanese phrase-like target found'
          assert all(not re.search(r'\s', x) for x in ko), 'Korean phrase-like target found'
          print('Validated 250 standalone concepts / 500 Intermediate entries.')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build generated vocabulary
        run: npm run build
      - name: Commit generated vocabulary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vocabulary-intermediate-curated-expansion.ts
          git diff --cached --quiet && exit 0
          git commit -m "Expand Intermediate vocabulary with 500 curated entries"
          git pull --rebase origin main
          git push origin main
