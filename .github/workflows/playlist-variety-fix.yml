name: Apply playlist variety fix

on:
  push:
    paths:
      - '.github/workflows/playlist-variety-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch playlist variety logic
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/main.tsx')
          text = path.read_text()

          old = 'const playlistBucketSize = 70;'
          new = 'const recentPlayedHistoryLimit = 200;'
          assert old in text, 'playlist bucket constant not found'
          text = text.replace(old, new, 1)

          old = '''  const playlist = useMemo(() => buildPlaylist(vocab, config, playlistSeed, playlistPage), [vocab, config, playlistSeed, playlistPage]);\n  const playlistKey = useMemo(() => getPlaylistKey(config), [config.targetLanguage, config.level, config.topic]);\n  const playlistItemCount = vocab.filter(\n    (item) => item.targetLanguage === config.targetLanguage && item.level === config.level && (config.topic === allTopics || item.topic === config.topic),\n  ).length;\n  const playlistPageCount = Math.max(1, Math.ceil(playlistItemCount / playlistBucketSize));'''
          new = '''  const recentPlayedIds = useMemo(() => {\n    const seen = new Set<string>();\n    const ids: string[] = [];\n    for (const record of history) {\n      for (const id of record.playedIds) {\n        if (seen.has(id)) continue;\n        seen.add(id);\n        ids.push(id);\n        if (ids.length >= recentPlayedHistoryLimit) return ids;\n      }\n    }\n    return ids;\n  }, [history]);\n  const playlist = useMemo(() => buildPlaylist(vocab, config, playlistSeed), [vocab, config, playlistSeed]);\n  const playlistKey = useMemo(() => getPlaylistKey(config), [config.targetLanguage, config.level, config.topic]);\n  const playlistPageCount = 1;'''
          assert old in text, 'playlist memo block not found'
          text = text.replace(old, new, 1)

          old = '''    const sessionPlaylist = config.playbackOrder === "Random" ? shuffle(playlist) : playlist;'''
          new = '''    const sessionPlaylist =\n      config.playbackOrder === "Random" ? deprioritizeRecent(shuffle(playlist), recentPlayedIds) : playlist;'''
          assert old in text, 'random session playlist line not found'
          text = text.replace(old, new, 1)

          old = '''function buildPlaylist(vocab: VocabItem[], config: SessionConfig, seed = 0, page = 0) {\n  const languageItems = vocab.filter((item) => item.targetLanguage === config.targetLanguage);\n  const levelItems = languageItems.filter((item) => item.level === config.level);\n  const topicItems = config.topic === allTopics ? levelItems : levelItems.filter((item) => item.topic === config.topic);\n  const backupItems = config.topic === allTopics ? levelItems : topicItems;\n  if (seed > 0) {\n    const pool = seededShuffle([...topicItems, ...backupItems], seed);\n    return takeUnique(pool, playlistBucketSize);\n  }\n  const uniquePool = takeUnique([...topicItems, ...backupItems], Number.MAX_SAFE_INTEGER);\n  const totalPages = Math.max(1, Math.ceil(uniquePool.length / playlistBucketSize));\n  const normalizedPage = page % totalPages;\n  const start = normalizedPage * playlistBucketSize;\n  const slice = uniquePool.slice(start, start + playlistBucketSize);\n  return slice.length > 0 ? slice : uniquePool.slice(0, playlistBucketSize);\n}\n'''
          new = '''function buildPlaylist(vocab: VocabItem[], config: SessionConfig, seed = 0) {\n  const languageItems = vocab.filter((item) => item.targetLanguage === config.targetLanguage);\n  const levelItems = languageItems.filter((item) => item.level === config.level);\n  const topicItems = config.topic === allTopics ? levelItems : levelItems.filter((item) => item.topic === config.topic);\n  const uniquePool = takeUnique(topicItems, Number.MAX_SAFE_INTEGER);\n  return seed > 0 ? seededShuffle(uniquePool, seed) : uniquePool;\n}\n\nfunction deprioritizeRecent(items: VocabItem[], recentIds: string[]) {\n  const recentRank = new Map(recentIds.map((id, index) => [id, index]));\n  return items\n    .map((item, randomIndex) => ({ item, randomIndex, rank: recentRank.get(item.id) }))\n    .sort((a, b) => {\n      const aRecent = a.rank !== undefined;\n      const bRecent = b.rank !== undefined;\n      if (aRecent !== bRecent) return aRecent ? 1 : -1;\n      if (aRecent && bRecent && a.rank !== b.rank) return (b.rank || 0) - (a.rank || 0);\n      return a.randomIndex - b.randomIndex;\n    })\n    .map(({ item }) => item);\n}\n'''
          assert old in text, 'buildPlaylist function not found'
          text = text.replace(old, new, 1)

          old = '''                  setPlaylistSeed(0);\n                  setPlaylistPage((p) => (p + 1) % playlistPageCount);'''
          new = '''                  setPlaylistSeed((s) => s + 1);\n                  setPlaylistPage(0);'''
          assert old in text, 'Next batch handler not found'
          text = text.replace(old, new, 1)

          old = '''            {playlistSeed === 0 ? ` · ${t("Batch")} ${playlistPage + 1}/${playlistPageCount}` : ""}'''
          new = '''            {playlistSeed === 0 ? "" : ` · ${t("Shuffle")} ${playlistSeed}`}'''
          assert old in text, 'playlist batch label not found'
          text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Improve playlist variety and recent-word rotation'
          git push origin HEAD:main
