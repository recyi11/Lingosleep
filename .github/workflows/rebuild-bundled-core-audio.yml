name: Rebuild content-addressed vocabulary audio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/vocabulary*.ts'
      - 'src/jlpt-level-map.ts'
      - 'src/korean-level-map.ts'
      - 'src/audio-v2.ts'
      - 'scripts/regenerate-bundled-core-audio.mjs'
      - '.github/workflows/rebuild-bundled-core-audio.yml'

permissions:
  contents: write

concurrency:
  group: rebuild-content-addressed-vocabulary-audio
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      MIN_VOCAB_COUNT: '3000'
      AUDIO_CONCURRENCY: '4'
      AUDIO_UPLOAD_CONCURRENCY: '12'
      AUDIO_TTS_TIMEOUT_MS: '45000'
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require Supabase Storage write key
        shell: bash
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "Missing GitHub Actions secret SUPABASE_SERVICE_ROLE_KEY or SUPABASE_SECRET_KEY."
            exit 1
          fi

      - name: Install app dependencies
        run: npm ci

      - name: Install Edge TTS
        run: python -m pip install --disable-pip-version-check edge-tts

      - name: Generate and upload changed core audio
        run: node scripts/regenerate-bundled-core-audio.mjs

      - name: Save audio manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/core-v2-manifest.json
          if git diff --cached --quiet; then
            echo "Audio manifest is unchanged."
            exit 0
          fi
          git commit -m "Update content-addressed audio manifest"
          git pull --rebase origin main
          git push origin HEAD:main
