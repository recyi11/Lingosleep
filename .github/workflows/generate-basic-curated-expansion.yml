name: Generate curated Basic vocabulary

on:
  push:
    paths:
      - 'scripts/generate_basic_curated_expansion.py'
      - '.github/workflows/generate-basic-curated-expansion.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install reading converter
        run: pip install pykakasi
      - name: Generate curated Basic expansion
        run: python scripts/generate_basic_curated_expansion.py
      - name: Validate entry count and duplicates
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('src/vocabulary-basic-expansion.ts').read_text()
          ids = re.findall(r'id: `([^`]+)`,', text)
          # IDs are generated from two templates, so inspect the 250 source rows instead.
          rows = re.findall(r'^\s*\["([^"]+)", "(noun|verb)", "([^"]*)", "([^"]*)", "([^"]+)", "([^"]+)", "([^"]+)", "([^"]+)"\],$', text, re.M)
          assert len(rows) == 250, f'Expected 250 concepts, got {len(rows)}'
          ja = [r[4] for r in rows]
          ko = [r[7] for r in rows]
          assert len(ja) == len(set(ja)), 'Duplicate Japanese targetText inside expansion'
          assert len(ko) == len(set(ko)), 'Duplicate Korean targetText inside expansion'
          assert all(r[5].strip() for r in rows), 'Blank Japanese reading'
          assert all(r[6].strip() for r in rows), 'Blank Japanese romanization'
          print('Validated 250 concepts / 500 Basic entries.')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit generated vocabulary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vocabulary-basic-expansion.ts
          git diff --cached --quiet && exit 0
          git commit -m "Expand Basic vocabulary with 500 curated entries"
          git pull --rebase origin main
          git push origin main
